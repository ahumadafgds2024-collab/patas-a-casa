<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex,nofollow">
<title>QR Simple</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#151515;--muted:#777169;--line:#e7e0d7;--accent:#ff6a36;--shadow:0 18px 55px rgba(33,27,21,.09)}
*{box-sizing:border-box}html{-webkit-tap-highlight-color:transparent;background:var(--bg)}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 20% -10%,#fff7f0 0,transparent 34%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 14px calc(70px + env(safe-area-inset-bottom))}.brand{font-size:13px;font-weight:950;letter-spacing:.14em;margin:4px 2px 18px}.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:25px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}h1{font-size:34px;line-height:1;letter-spacing:-.055em;margin:4px 0 10px}p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 18px}.label{font-size:11px;font-weight:900;margin:0 0 7px 2px}.input{width:100%;min-height:54px;border:1px solid #ddd5cc;border-radius:16px;background:#fff;padding:14px;font:inherit;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}.input:focus{border-color:rgba(255,106,54,.55);box-shadow:0 0 0 4px rgba(255,106,54,.09)}.btn{width:100%;min-height:54px;border:0;border-radius:16px;margin-top:10px;background:#171717;color:#fff;font:inherit;font-weight:950;cursor:pointer;transition:transform .1s ease,filter .15s ease}.btn:active{transform:scale(.975)}.btn:disabled{opacity:.55}.result{display:none}.result.on{display:block;animation:up .24s ease both}.short{display:flex;gap:8px}.url{flex:1;min-width:0;background:#f4f0ea;border:1px solid var(--line);border-radius:15px;padding:13px;font-size:13px;font-weight:850;word-break:break-all}.copy{width:50px;border:0;border-radius:15px;background:#171717;color:#fff;font-size:18px}.qr{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:21px;padding:16px;margin:14px 0}.qr svg{width:min(100%,350px);height:auto}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.stat{background:#f8f5f0;border:1px solid var(--line);border-radius:15px;padding:12px}.stat span{display:block;font-size:10px;color:var(--muted);font-weight:800}.stat b{display:block;font-size:21px;margin-top:3px}.best{color:#23734f}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.download{min-height:49px;border:0;border-radius:15px;font:inherit;font-weight:900;cursor:pointer}.download.dark{background:#171717;color:#fff}.download.soft{background:#eee8e1;color:#28231f}.status{display:none;margin-top:10px;padding:11px 12px;border-radius:14px;font-size:12px}.status.err{display:block;background:#fff0f1;color:#9d2d39}.status.ok{display:block;background:#eaf6ef;color:#1d6846}.tiny{font-size:11px;color:var(--muted);line-height:1.45;margin-top:10px}.pill{display:inline-flex;margin-top:10px;padding:7px 9px;border-radius:999px;background:#fff1e9;color:#b54a24;font-size:10px;font-weight:950;letter-spacing:.04em}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:390px){h1{font-size:31px}.card{padding:18px;border-radius:22px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="app">
  <div class="brand">QR SIMPLE</div>
  <section class="card">
    <h1>Pegá el link.<br>Te doy el QR.</h1>
    <p>Sin cuentas, sin claves y sin configuraciones. Acorta la URL y genera el QR con la menor cantidad de módulos posible para grabado láser.</p>
    <div class="label">URL</div>
    <input id="url" class="input" inputmode="url" autocomplete="url" placeholder="https://...">
    <button id="go" class="btn">Acortar + generar QR</button>
    <div id="status" class="status"></div>
  </section>

  <section id="result" class="card result">
    <div class="label">URL CORTA</div>
    <div class="short"><div id="short" class="url"></div><button id="copy" class="copy" aria-label="Copiar">⧉</button></div>
    <div class="stats">
      <div class="stat"><span>ANTES</span><b id="before">—</b></div>
      <div class="stat"><span>QR FINAL</span><b id="after" class="best">—</b></div>
    </div>
    <div id="minpill" class="pill">Máxima simpleza · Corrección L</div>
    <div id="qr" class="qr"></div>
    <div class="row"><button id="png" class="download dark">PNG</button><button id="svg" class="download soft">SVG láser</button></div>
    <div id="detail" class="tiny"></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);let state=null;
function status(t,type='err'){const e=$('status');e.textContent=t;e.className='status '+type}
function clearStatus(){$('status').className='status';$('status').textContent=''}
function randomCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='__vgd_'+Date.now()+'_'+Math.random().toString(36).slice(2);const sc=document.createElement('script');let done=false;window[cb]=data=>{done=true;cleanup();resolve(data)};function cleanup(){delete window[cb];sc.remove()}sc.onerror=()=>{if(!done){cleanup();reject(new Error('No se pudo conectar con el acortador.'))}};params.set('callback',cb);params.set('format','json');sc.src='https://v.gd/create.php?'+params.toString();document.head.appendChild(sc);setTimeout(()=>{if(!done){cleanup();reject(new Error('El acortador tardó demasiado. Probá de nuevo.'))}},12000)})}
async function shorten(url){for(let i=0;i<8;i++){const code=randomCode();const p=new URLSearchParams({url,shorturl:code});const data=await jsonp(p);if(data?.shorturl)return data.shorturl;if(Number(data?.errorcode)===2)continue;throw new Error(data?.errormessage||'No se pudo acortar la URL.')}throw new Error('No pude conseguir un código libre. Probá otra vez.')}
function makeQR(text){if(typeof qrcode!=='function')throw new Error('No se cargó el generador QR. Recargá la página.');const q=qrcode(0,'L');const alpha=/^[0-9A-Z $%*+\-./:]+$/.test(text);q.addData(text,alpha?'Alphanumeric':'Byte');q.make();return q}
function info(q){const n=q.getModuleCount();return{n,version:(n-17)/4}}
function svg(q){const n=q.getModuleCount(),z=4,t=n+z*2;let d='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))d+=`M${x+z} ${y+z}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${t} ${t}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><path fill="black" d="${d}"/></svg>`}
async function go(){clearStatus();const raw=$('url').value.trim();let u;try{u=new URL(raw);if(!/^https?:$/.test(u.protocol))throw 0}catch{status('Pegá una URL completa que empiece con http:// o https://');return}const b=$('go');b.disabled=true;b.textContent='Acortando…';try{const short=await shorten(u.href);const payload=short.toUpperCase();const old=makeQR(u.href),q=makeQR(payload),a=info(old),c=info(q);state={short,payload,q};$('short').textContent=short;$('before').textContent=a.n+'×'+a.n;$('after').textContent=c.n+'×'+c.n;$('qr').innerHTML=svg(q);$('result').classList.add('on');$('detail').textContent=c.version===1?'Llegaste al QR mínimo estándar: Versión 1, 21×21 módulos. Ideal para probar con láser.':`QR Versión ${c.version}, ${c.n}×${c.n} módulos.`;status('Listo.','ok');$('result').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){status(e.message||'No se pudo generar el QR.')}finally{b.disabled=false;b.textContent='Acortar + generar QR'}}
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function saveSvg(){if(!state)return;dl('qr-simple.svg',new Blob([svg(state.q)],{type:'image/svg+xml'}))}
function savePng(){if(!state)return;const q=state.q,n=q.getModuleCount(),quiet=4,scale=36,size=(n+quiet*2)*scale,c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#000';for(let y=0;y<n;y++)for(let col=0;col<n;col++)if(q.isDark(y,col))x.fillRect((col+quiet)*scale,(y+quiet)*scale,scale,scale);c.toBlob(b=>dl('qr-simple.png',b),'image/png')}
$('go').addEventListener('click',go);$('url').addEventListener('keydown',e=>{if(e.key==='Enter')go()});$('copy').addEventListener('click',async()=>{if(!state)return;await navigator.clipboard.writeText(state.short);$('copy').textContent='✓';setTimeout(()=>$('copy').textContent='⧉',900)});$('svg').addEventListener('click',saveSvg);$('png').addEventListener('click',savePng);
</script>
</body>
</html>
