name: Apply Account Security 20260830

on:
  push:
    paths:
      - '.github/workflows/apply-account-security-20260830.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply account security changes
        run: python .github/scripts/apply_account_security_20260830.py
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          import re
          for path in ['index.html','mi-cuenta/index.html']:
              html=open(path,encoding='utf-8').read()
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
              out='/tmp/'+path.replace('/','_')+'.js'
              open(out,'w',encoding='utf-8').write('\n'.join(scripts))
              print(path, 'scripts:',len(scripts))
          PY
          node --check /tmp/index.html.js
          node --check /tmp/mi-cuenta_index.html.js
      - name: Verify requested behavior
        run: |
          grep -q 'if(!isiOS()&&settings?.external?.google)' index.html
          grep -q 'if(isiOS())return' mi-cuenta/index.html
          grep -q 'Crear o cambiar contraseña' mi-cuenta/index.html
          grep -q 'Borrar cuenta' mi-cuenta/index.html
          grep -q 'patas-account-security' mi-cuenta/index.html
          grep -q 'Tu chapita está lista' index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html mi-cuenta/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mi-cuenta/index.html
          git commit -m 'Mejorar activación en iPhone y seguridad de cuenta'
          git push
