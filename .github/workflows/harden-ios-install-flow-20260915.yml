name: Harden iPhone install flow

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/harden_ios_install_flow_20260915.py'
      - '.github/workflows/harden-ios-install-flow-20260915.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar correcciones iPhone
        run: python .github/scripts/harden_ios_install_flow_20260915.py
      - name: Verificar sintaxis JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('mi-cuenta/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          inline = [b for b in blocks if b.strip()]
          if not inline:
              raise SystemExit('No se encontró JavaScript inline')
          Path('/tmp/mi-cuenta-inline.js').write_text('\n'.join(inline), encoding='utf-8')
          print(f'Bloques inline: {len(inline)}')
          PY
          node --check /tmp/mi-cuenta-inline.js
      - name: Verificar diff
        run: |
          git diff --check
          grep -q 'Listo, voy a agregarla' mi-cuenta/index.html
          grep -q 'pac_install_done_v1' mi-cuenta/index.html
          grep -q 'pac-owner-v10' mi-cuenta/sw.js
          for n in 1 2 3 4; do grep -q "/mi-cuenta/ios-guia/paso-$n.jpg" mi-cuenta/sw.js; done
      - name: Publicar corrección
        run: |
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-cuenta/index.html mi-cuenta/sw.js
          if git diff --cached --quiet; then
            echo 'Sin cambios pendientes'
            exit 0
          fi
          git commit -m 'Blindar instalación de Patas a Casa en iPhone'
          git push origin HEAD:main
