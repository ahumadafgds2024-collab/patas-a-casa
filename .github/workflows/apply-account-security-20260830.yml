name: Apply Account Security 20260830

on:
  push:
    paths:
      - '.github/workflows/apply-account-security-20260830.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar parte 1
        run: python .github/scripts/apply_account_security_20260830.py
      - name: Verificar resultado
        run: |
          grep -q 'const activationIsiOS=' index.html
          grep -q 'Activá tu chapita.' index.html
          grep -q 'forEach(el=>el.remove());return' mi-cuenta/index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html mi-cuenta/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mi-cuenta/index.html
          git commit -m 'Ocultar Google en iPhone y limpiar activación'
          git push
