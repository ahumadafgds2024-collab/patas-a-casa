<script>

function esc(v=""){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function tel(v=""){return String(v??"").replace(/[^\d+]/g,"")}
function wa(v=""){
 let digits=String(v??"").replace(/\D/g,"");
 if(digits.startsWith("00"))digits=digits.slice(2);
 if(digits.startsWith("549"))return digits;
 if(digits.startsWith("54"))return "549"+digits.slice(2).replace(/^0/,"");
 digits=digits.replace(/^0/,"");
 return digits.length===10?"549"+digits:digits;
}
function formatLostDateTime(v){const d=new Date(v);if(Number.isNaN(d.getTime()))return "";return new Intl.DateTimeFormat("es-AR",{dateStyle:"medium",timeStyle:"short"}).format(d)}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
let fieldSequence=0;
function prepareFormFields(scope=document){
 scope.querySelectorAll?.(".field").forEach(field=>{
   const label=field.querySelector(":scope > label"),control=field.querySelector("input:not([type=hidden]), textarea, select");
   if(!label||!control)return;
   if(!control.id)control.id="pac-field-"+(++fieldSequence);
   label.htmlFor=control.id;
 });
}
document.addEventListener("input",event=>{
 const control=event.target;
 if(control.matches?.("[data-pin]"))control.value=control.value.replace(/\D/g,"").slice(0,8);
 control.setCustomValidity?.("");
});
document.addEventListener("invalid",event=>{
 const control=event.target;
 if(!control.setCustomValidity)return;
 if(control.matches?.("[data-pin]"))control.setCustomValidity("Ingresá los 8 números del PIN.");
 else if(control.validity?.valueMissing)control.setCustomValidity("Completá este campo.");
 else if(control.validity?.typeMismatch)control.setCustomValidity("Ingresá un dato válido.");
},true);
new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1)prepareFormFields(node)}))).observe(root,{childList:true,subtree:true});
prepareFormFields(document);
function bindPasswordToggles(scope=document){
 scope.querySelectorAll("[data-password-toggle]").forEach(button=>button.addEventListener("click",()=>{
   const input=document.getElementById(button.dataset.passwordToggle);if(!input)return;
   const showing=input.type==="text";input.type=showing?"password":"text";button.textContent=showing?"👁":"🙈";button.setAttribute("aria-label",showing?"Mostrar contraseña":"Ocultar contraseña");button.setAttribute("aria-pressed",String(!showing));
 }));
}
function openPhotoViewer(src,name=""){
 const old=document.getElementById("photoLightbox");if(old)old.remove();
 const overlay=document.createElement("div");overlay.id="photoLightbox";overlay.className="photo-lightbox";
 const img=document.createElement("img");img.src=src;img.alt="Foto ampliada de "+name;
 const closeBtn=document.createElement("button");closeBtn.type="button";closeBtn.className="photo-lightbox-close";closeBtn.setAttribute("aria-label","Cerrar foto");closeBtn.textContent="×";
 const hint=document.createElement("div");hint.className="photo-lightbox-hint";hint.textContent="Tocá afuera para cerrar";
 const onKey=e=>{if(e.key==="Escape")close()};
 const close=()=>{document.removeEventListener("keydown",onKey);document.body.style.overflow="";overlay.remove()};
 closeBtn.addEventListener("click",close);overlay.addEventListener("click",e=>{if(e.target===overlay)close()});document.addEventListener("keydown",onKey);
 overlay.append(img,closeBtn,hint);document.body.appendChild(overlay);document.body.style.overflow="hidden";
}
function getCurrentLocation(){
 return new Promise(resolve=>{
   if(!navigator.geolocation){resolve({ok:false,message:"Este navegador no permite compartir ubicación."});return}
   navigator.geolocation.getCurrentPosition(
     pos=>resolve({ok:true,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy}),
     err=>{
       const messages={1:"No diste permiso para usar tu ubicación.",2:"El celular no pudo determinar tu ubicación.",3:"La ubicación tardó demasiado en responder."};
       resolve({ok:false,message:messages[err.code]||"No pudimos obtener tu ubicación."});
     },
     {enableHighAccuracy:false,timeout:15000,maximumAge:60000}
   );
 });
}

function compressPhoto(file){
 return new Promise((resolve,reject)=>{
   if(!file){resolve(null);return}
   if(!file.type.startsWith("image/")){reject(new Error("Elegí una imagen válida."));return}
   if(file.size>12*1024*1024){reject(new Error("La foto original es demasiado grande."));return}
   const reader=new FileReader();
   reader.onerror=()=>reject(new Error("No pudimos leer la foto."));
   reader.onload=()=>{
     const img=new Image();
     img.onerror=()=>reject(new Error("No pudimos procesar esa foto. Probá con JPG o PNG."));
     img.onload=()=>{
       const max=900,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
       const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
       const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
       const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
       resolve(canvas.toDataURL("image/jpeg",.82));
     };
     img.src=String(reader.result);
   };
   reader.readAsDataURL(file);
 });
}
function bindPhotoPreview(inputId,previewId){
 const input=document.getElementById(inputId),preview=document.getElementById(previewId);if(!input||!preview)return;
 input.addEventListener("change",()=>{
   const file=input.files?.[0];if(!file)return;
   const url=URL.createObjectURL(file);preview.innerHTML=`<img src="${url}" alt="Vista previa">`;
 });
}

function home(){
 document.title="Patas a Casa";
 root.innerHTML=`<section class="card hero"><div class="kicker">IDENTIFICACIÓN INTELIGENTE</div><h1>Una forma simple de volver a casa.</h1><p class="muted">Cada chapita Patas a Casa conecta a la mascota con un perfil actualizado y formas rápidas de contactar a su familia.</p><div class="note"><b>¿Encontraste una mascota?</b><br>Escaneá el QR de su chapita. No necesitás descargar una app ni crear una cuenta.</div><a class="btn dark" style="margin-top:12px" href="/mi-cuenta/">👤 Entrar a Mi cuenta</a><p class="small muted" style="text-align:center;margin:12px 4px 0">Si tu chapita es nueva, escaneá su QR para activarla.</p></section>`;
}

function unactivated(c){
 document.title="Activar chapita · Patas a Casa";
 root.innerHTML=`<section class="card hero">
   <div class="kicker">CHAPITA NUEVA</div>
   <h1>Activá tu chapita 🐾</h1>
   <p class="muted">Te va a llevar menos de un minuto. El PIN viene con la chapita y se usa para comprobar que es tuya.</p>
   <div class="stepbar"><div class="step on"></div><div class="step"></div><div class="step"></div><div class="step"></div></div>
 </section>
 <section class="card">
   <form id="pinForm" method="post">
     <div class="field"><label>PIN de activación</label><input class="pin" name="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" data-pin placeholder="00000000" required><div class="small muted" style="margin-top:6px">Poné los 8 números del PIN.</div></div>
     <button class="btn primary" id="continue" type="submit">Continuar</button>
   </form>
   <p class="small muted" style="text-align:center;margin-bottom:0">Código de chapita: ${esc(c)}</p>
 </section>`;
 document.getElementById("pinForm").addEventListener("submit",async e=>{
   e.preventDefault();const pin=new FormData(e.currentTarget).get("pin"),b=document.getElementById("continue");b.disabled=true;b.textContent="Verificando…";
   try{await post({action:"verify_pin",public_code:c,activation_code:pin});accountSetupForm(c,String(pin));}
   catch(err){toast(err.message);b.disabled=false;b.textContent="Continuar"}
 });
}

function accountSetupForm(c,pin){
 root.innerHTML=`<section class="card hero">
   <div class="kicker">SEGURIDAD DE LA CUENTA</div>
   <h1>Configurá tu acceso.</h1>
   <p class="muted">Antes de crear el perfil, elegí el correo y la contraseña con los que vas a administrarlo.</p>
   <div class="stepbar"><div class="step on"></div><div class="step on"></div><div class="step"></div><div class="step"></div></div>
 </section>
 <section class="card">
   <div class="note" style="margin-bottom:14px"><b>Chapita ${esc(c)} verificada ✅</b><br>No tenés que ingresar el código ni el PIN otra vez.</div>
   <div class="hidden" id="googleActivationOptions">
    <button class="btn google" id="googleActivation" type="button"><span class="google-mark" aria-hidden="true">G</span>Continuar con Google</button>
    <div class="auth-divider">o creá tu acceso con email</div>
   </div>
   <form id="accountSetup" method="post">
     <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" placeholder="tu@email.com" maxlength="254" required></div>
     <div class="field"><label>Elegí una contraseña</label><div class="password-wrap"><input id="activationPassword" name="password" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-password-toggle="activationPassword" aria-label="Mostrar contraseña" aria-pressed="false">👁</button></div><div class="small muted" style="margin-top:6px">Mínimo 8 caracteres.</div></div>
     <label class="check"><input id="legalActivation" type="checkbox" required><div><b>Acepto las condiciones de uso y la privacidad</b><div class="small muted">Al crear la cuenta aceptás las <a href="/terminos.html" target="_blank" rel="noopener" style="font-weight:900;color:#171719">Condiciones de uso</a> y consentís el tratamiento de tus datos según la <a href="/privacidad.html" target="_blank" rel="noopener" style="font-weight:900;color:#171719">Política de Privacidad</a>.</div></div></label>
     <button class="btn primary" id="accountContinue" type="submit">Crear cuenta y verificar correo</button>
   </form>
 </section>`;
 bindPasswordToggles(root);
 fetch(SUPABASE_URL+"/auth/v1/settings",{headers:{apikey:PUBLISHABLE_KEY}}).then(r=>r.ok?r.json():null).then(settings=>{if(settings?.external?.google)document.getElementById("googleActivationOptions")?.classList.remove("hidden")}).catch(()=>{});
 document.getElementById("googleActivation").addEventListener("click",()=>{
   if(!document.getElementById("legalActivation")?.checked){toast("Aceptá las condiciones de uso y la Política de Privacidad para continuar.");return}
   localStorage.setItem("pac_legal_consent",JSON.stringify({version:"2026-08-28",accepted_at:new Date().toISOString()}));
   sessionStorage.setItem(GOOGLE_PENDING_KEY,JSON.stringify({public_code:c,activation_code:pin,created_at:Date.now()}));
   location.assign("/mi-cuenta/?google=1");
 });
 document.getElementById("accountSetup").addEventListener("submit",async e=>{
   e.preventDefault();const f=new FormData(e.currentTarget),mail=String(f.get("email")||"").trim().toLowerCase(),password=String(f.get("password")||""),button=document.getElementById("accountContinue");
   if(password.length<8){toast("La contraseña tiene que tener al menos 8 caracteres.");return}
   button.disabled=true;button.textContent="Enviando verificación…";
   try{localStorage.setItem("pac_legal_consent",JSON.stringify({version:"2026-08-28",accepted_at:new Date().toISOString()}));await registerPost({action:"start_registration",public_code:c,activation_code:pin,email:mail,password,legal_consent:true,legal_version:"2026-08-28"});activationComplete(mail)}
   catch(err){toast(err.message);button.disabled=false;button.textContent="Crear cuenta y verificar correo"}
 });
}

function activationComplete(mail){
 document.title="Revisá tu correo · Patas a Casa";
 root.innerHTML=`<section class="card hero"><div class="kicker">VERIFICAR CORREO</div><h1>Revisá tu correo ✅</h1><p class="muted">Te enviamos un enlace de verificación a <b>${esc(mail)}</b>.</p><div class="stepbar"><div class="step on"></div><div class="step on"></div><div class="step on"></div><div class="step"></div></div></section><section class="card"><div class="note"><b>¿Qué sigue?</b><br>Abrí el enlace del correo. Si no lo encontrás en la bandeja de entrada, revisá Spam. Al confirmarlo, vas a cargar los datos de tu mascota y después vas a entrar a Mi cuenta con la mascota ya creada.</div></section>`;
}

function active(c,p){
 document.title=(p?.name?`${p.name} · `:"")+"Patas a Casa";
 const lost=p.status==="perdido",allowContact=p.public_contact!==false,phone=allowContact?tel(p.contact_phone):"",whats=allowContact?wa(p.contact_whatsapp||p.contact_phone):"";
 const lostWhen=p.lost_at?formatLostDateTime(p.lost_at):"";
 const lostCard=lost?`<div class="box warn"><strong>🚨 ${esc(p.name)} está perdido</strong>${p.lost_location?`<div style="margin-top:8px"><b>Última vez visto:</b> ${esc(p.lost_location)}</div>`:""}${lostWhen?`<div class="small muted" style="margin-top:4px">🕒 ${esc(lostWhen)}</div>`:""}${p.lost_details?`<div style="margin-top:9px">${esc(p.lost_details)}</div>`:""}<div class="small" style="margin-top:9px"><b>Si lo encontraste, contactá a su familia.</b></div></div>`:"";
 const health=p.public_health&&(p.diseases||p.medications||p.allergies||p.special_care||p.vet_info)?`<section class="card"><h2>❤️ Salud y cuidados</h2>${p.diseases?`<div class="box warn"><strong>Enfermedades</strong>${esc(p.diseases)}</div>`:""}${p.medications?`<div class="box"><strong>Medicación</strong>${esc(p.medications)}${p.medication_schedule?" · "+esc(p.medication_schedule):""}</div>`:""}${p.allergies?`<div class="box"><strong>Alergias</strong>${esc(p.allergies)}</div>`:""}${p.special_care?`<div class="box"><strong>Cuidados especiales</strong>${esc(p.special_care)}</div>`:""}${p.vet_info?`<div class="box"><strong>Veterinario / dato útil</strong>${esc(p.vet_info)}</div>`:""}</section>`:"";
 root.innerHTML=`<section class="card hero">
   <span class="status ${lost?"lost":""}">● ${lost?"MI FAMILIA ME ESTÁ BUSCANDO":"IDENTIFICADO"}</span>
   <div class="petrow"><div class="avatar ${p.photo_url?"has-photo":""}">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="Foto de ${esc(p.name)}">`:p.species==="Gato"?"🐱":"🐶"}</div><div><div class="petname">${esc(p.name)}</div><div class="meta">${esc(p.breed||p.species)}${p.sex?" · "+esc(p.sex):""}${p.age_text?" · "+esc(p.age_text):""}</div><div class="chips">${p.size?`<span class="chip">${esc(p.size)}</span>`:""}${p.color?`<span class="chip">${esc(p.color)}</span>`:""}</div></div></div>
   ${lostCard}
 </section>
 <section class="card"><h2>Contactá a su familia</h2><div class="actions">${phone?`<a class="btn dark" href="tel:${esc(phone)}">📞 Llamar</a>`:""}${whats?`<a class="btn green" target="_blank" rel="noopener" href="https://wa.me/${esc(whats)}?text=${encodeURIComponent("Hola, encontré a "+p.name+".")}">💬 WhatsApp</a>`:""}</div>${allowContact&&p.alt_contact?`<div class="box" style="margin-top:10px"><strong>Segundo contacto de emergencia</strong>${esc(p.alt_contact)}</div>`:""}${!phone&&!whats&&!(allowContact&&p.alt_contact)?`<div class="note" style="margin-top:10px">Los datos de contacto no están publicados. Podés enviar un aviso desde el formulario de abajo.</div>`:""}</section>
 ${health}
 <section class="card"><h2>📍 ¿Encontraste a ${esc(p.name)}?</h2><p class="small muted">Podés enviarle tu ubicación actual a su familia por WhatsApp. Compartirla es opcional.</p>
   <form id="found" method="post">
     <div class="field"><label>Mensaje</label><textarea name="message" maxlength="500" placeholder="Ej. Está conmigo en la plaza y parece estar bien."></textarea></div>
     <div class="field"><label>Zona aproximada</label><input name="area_text" maxlength="120" placeholder="Ej. Godoy Cruz, Mendoza"></div>
     <label class="check"><input id="geo" type="checkbox"><div><b>Compartir mi ubicación actual</b><div class="small muted">Tu celular te pedirá permiso. Si aceptás, se agrega un link de Google Maps al mensaje de WhatsApp.</div></div></label>
     <div id="geoStatus" class="small muted" style="margin:-2px 2px 12px"></div>
     <button id="foundBtn" class="btn primary" type="submit">Enviar aviso por WhatsApp</button>
   </form>
 </section>
 <div class="owner"><button id="ownerBtn">¿Sos su responsable? Administrar perfil</button></div>`;
 if(p.photo_url){
   const petPhoto=document.querySelector(".avatar.has-photo");
   if(petPhoto){
     petPhoto.setAttribute("role","button");petPhoto.setAttribute("tabindex","0");petPhoto.setAttribute("aria-label","Ver foto grande de "+p.name);
     petPhoto.addEventListener("click",()=>openPhotoViewer(p.photo_url,p.name));
     petPhoto.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openPhotoViewer(p.photo_url,p.name)}});
   }
 }
 let cachedGeo=null;
 const geoInput=document.getElementById("geo"),geoStatus=document.getElementById("geoStatus");
 geoInput.addEventListener("change",async()=>{
   if(!geoInput.checked){cachedGeo=null;geoStatus.textContent="";return}
   geoStatus.textContent="📍 Obteniendo tu ubicación…";
   const result=await getCurrentLocation();
   if(result.ok){cachedGeo=result;geoStatus.textContent="✅ Ubicación lista para compartir"}
   else{cachedGeo=null;geoStatus.textContent="⚠️ "+result.message+" Podés volver a intentarlo o desmarcar esta opción."}
 });
 document.getElementById("found").addEventListener("submit",async e=>{
   e.preventDefault();
   const form=e.currentTarget,f=new FormData(form),geoWanted=geoInput.checked,b=document.getElementById("foundBtn");
   b.disabled=true;b.textContent="Preparando WhatsApp…";
   let g=cachedGeo;
   if(geoWanted&&!g){
     geoStatus.textContent="📍 Obteniendo tu ubicación…";
     const result=await getCurrentLocation();
     if(!result.ok){geoStatus.textContent="⚠️ "+result.message+" Podés volver a intentarlo o desmarcar esta opción.";toast(result.message);b.disabled=false;b.textContent="Enviar aviso por WhatsApp";return}
     g=result;cachedGeo=result;geoStatus.textContent="✅ Ubicación lista para compartir";
   }
   try{
     if(!whats)throw new Error("La familia no tiene un WhatsApp cargado.");
     const finderMessage=String(f.get("message")||"").trim(),area=String(f.get("area_text")||"").trim();
     const parts=["Hola, encontré a "+p.name+"."];
     if(finderMessage)parts.push(finderMessage);
     if(area)parts.push("Zona aproximada: "+area);
     if(geoWanted&&g)parts.push("📍 Mi ubicación: https://maps.google.com/?q="+g.latitude+","+g.longitude);
     parts.push("Mensaje enviado desde Patas a Casa.");
     const whatsappUrl="https://wa.me/"+whats+"?text="+encodeURIComponent(parts.join("\n\n"));
     toast("Abriendo WhatsApp…");setTimeout(()=>{window.location.href=whatsappUrl},250);
   }
   catch(err){toast(err.message)}finally{b.disabled=false;b.textContent="Enviar aviso por WhatsApp"}
 });
 document.getElementById("ownerBtn").addEventListener("click",()=>{location.href="/mi-cuenta/?vincular="+encodeURIComponent(c)});
}

function ownerEdit(c,p){
 root.innerHTML=`<section class="card hero"><div class="kicker">RESPONSABLE</div><h1>Editá el perfil.</h1><p class="muted">Usá el PIN privado para cambiar la foto y los datos de tu mascota.</p></section>
 <section class="card"><form id="ownerForm" method="post">
 <div class="field"><label>PIN privado</label><input class="pin" name="activation_code" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" data-pin placeholder="00000000" required><div class="small muted" style="margin-top:6px">Poné los 8 números del PIN.</div></div>
 <div class="photo-pick"><div class="photo-preview" id="ownerPhotoPreview">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="Foto actual">`:p.species==="Gato"?"🐱":"🐶"}</div><div class="photo-actions"><b>Foto de ${esc(p.name)}</b><span class="small muted">Podés reemplazarla cuando quieras.</span><label class="file-btn">📷 Cambiar foto<input id="ownerPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/*"></label>${p.photo_url?`<label class="small"><input id="removePhoto" type="checkbox"> Quitar foto actual</label>`:""}</div></div>
 <div class="field"><label>Nombre</label><input name="name" value="${esc(p.name)}" required></div>
 <div class="note" style="margin-bottom:14px">Para marcar a ${esc(p.name)} como perdido y cargar dónde y cuándo se perdió, usá <a href="/mi-cuenta/" style="font-weight:900;color:#171719">Mi cuenta</a>.</div>
 <div class="split"><div class="field"><label>Especie</label><select name="species"><option ${p.species==="Perro"?"selected":""}>Perro</option><option ${p.species==="Gato"?"selected":""}>Gato</option><option ${p.species!=="Perro"&&p.species!=="Gato"?"selected":""}>Otra</option></select></div><div class="field"><label>Raza</label><input name="breed" value="${esc(p.breed||"")}"></div></div>
 <div class="split"><div class="field"><label>Sexo</label><select name="sex"><option value="" ${!p.sex?"selected":""}>Sin informar</option><option ${p.sex==="Macho"?"selected":""}>Macho</option><option ${p.sex==="Hembra"?"selected":""}>Hembra</option></select></div><div class="field"><label>Edad</label><input name="age_text" value="${esc(p.age_text||"")}" placeholder="Ej. 4 años"></div></div>
 <div class="split"><div class="field"><label>Tamaño</label><select name="size"><option value="" ${!p.size?"selected":""}>Sin informar</option><option ${p.size==="Pequeño"?"selected":""}>Pequeño</option><option ${p.size==="Mediano"?"selected":""}>Mediano</option><option ${p.size==="Grande"?"selected":""}>Grande</option></select></div><div class="field"><label>Color / señas</label><input name="color" value="${esc(p.color||"")}"></div></div>
 <div class="split"><div class="field"><label>Responsable</label><input name="contact_name" value="${esc(p.contact_name||"")}"></div><div class="field"><label>WhatsApp / teléfono</label><input name="contact_whatsapp" inputmode="tel" value="${esc(p.contact_whatsapp||p.contact_phone||"")}"></div></div>
 <details class="optional" open><summary>❤️ Salud y cuidados</summary>
 <div class="field"><label>Enfermedades</label><textarea name="diseases">${esc(p.diseases||"")}</textarea></div><div class="field"><label>Medicamentos</label><textarea name="medications">${esc(p.medications||"")}</textarea></div><div class="field"><label>Frecuencia</label><input name="medication_schedule" value="${esc(p.medication_schedule||"")}"></div><div class="field"><label>Alergias</label><textarea name="allergies">${esc(p.allergies||"")}</textarea></div><div class="field"><label>Cuidados especiales</label><textarea name="special_care">${esc(p.special_care||"")}</textarea></div><div class="field"><label>Veterinario / dato útil</label><textarea name="vet_info">${esc(p.vet_info||"")}</textarea></div></details>
 <label class="check"><input name="public_health" type="checkbox" ${p.public_health?"checked":""}><div><b>Mostrar salud importante</b><div class="small muted">Sólo se muestra si está marcado.</div></div></label>
 <button id="saveOwner" class="btn primary" type="submit">Guardar cambios</button></form></section>`;
 bindPhotoPreview("ownerPhoto","ownerPhotoPreview");
 document.getElementById("ownerForm").addEventListener("submit",async e=>{
   e.preventDefault();const f=new FormData(e.currentTarget),o=Object.fromEntries(f.entries()),b=document.getElementById("saveOwner"),photo=document.getElementById("ownerPhoto").files?.[0];
   Object.assign(o,{action:"update_pet",public_code:c,status:p.status,contact_phone:o.contact_whatsapp,public_health:f.get("public_health")==="on",public_contact:true,remove_photo:Boolean(document.getElementById("removePhoto")?.checked)});
   b.disabled=true;
   try{if(photo){b.textContent="Preparando foto…";o.photo_data=await compressPhoto(photo);o.remove_photo=false}b.textContent="Guardando…";await post(o);toast("Cambios guardados ✅");setTimeout(()=>location.href="?tag="+encodeURIComponent(c),500)}
   catch(err){toast(err.message);b.disabled=false;b.textContent="Guardar cambios"}
 });
}

async function boot(){
 if(!code){home();return}
 root.innerHTML='<section class="card loading">Leyendo chapita…</section>';
 try{const data=await getTag(code);if(data.state==="unactivated")unactivated(code);else{const lostInfo=await getLostInfo(code).catch(()=>null);active(code,{...data.pet,...(lostInfo||{})})}}
 catch(err){root.innerHTML=`<section class="card"><h2>No pudimos abrir esta chapita</h2><p class="muted">${esc(err.message)}</p></section>`}
}
boot();
</script>
</body>
</html>
