<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e9">
<meta name="description" content="Mascotas perdidas de la comunidad Patas a Casa.">
<link rel="icon" type="image/png" href="/mi-cuenta/icons/icon-192.png">
<link rel="manifest" href="/mi-cuenta/manifest.webmanifest">
<link rel="apple-touch-icon" href="/mi-cuenta/icons/icon-192.png">
<title>Mascotas perdidas · Patas a Casa</title>
<style>
:root{--bg:#f6f1e9;--card:#fffdfa;--ink:#181817;--muted:#746d64;--line:rgba(49,39,31,.09);--red:#d83f50;--green:#23734f;--shadow:0 12px 34px rgba(53,38,25,.075),0 2px 7px rgba(53,38,25,.035)}
*{box-sizing:border-box}html{background:var(--bg);-webkit-tap-highlight-color:transparent}body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% -6%,rgba(255,160,105,.16),transparent 28%),linear-gradient(180deg,#faf7f2 0,var(--bg) 52%,#f3ede5 100%);min-height:100dvh}
.app{max-width:520px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 12px calc(86px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 3px 18px}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:950;letter-spacing:-.03em}.logo{width:45px;height:45px;border-radius:50%;background:linear-gradient(145deg,#27231f,#141312);display:grid;place-items:center;color:#fff;box-shadow:0 9px 22px rgba(24,20,17,.17)}
a{text-decoration:none;color:inherit}.back{min-height:42px;padding:10px 12px;border-radius:14px;background:#f1ece5;font-size:12px;font-weight:900;display:flex;align-items:center}.hero,.pet,.empty,.error{background:rgba(255,253,250,.95);border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow)}.hero{padding:20px;margin-bottom:12px}.kicker{font-size:10px;letter-spacing:.105em;font-weight:950;color:#b13b49}h1{font-size:34px;line-height:1.02;letter-spacing:-.052em;margin:9px 0 10px}p{line-height:1.48}.muted{color:var(--muted)}.small{font-size:12px}.list{display:grid;gap:12px}.pet{padding:15px}.head{display:flex;align-items:center;gap:13px}.avatar{width:82px;height:82px;flex:0 0 82px;border-radius:24px;background:linear-gradient(145deg,#fff1e9,#ffe1d2);display:grid;place-items:center;font-size:40px;overflow:hidden;box-shadow:0 8px 22px rgba(63,42,25,.10)}.avatar.photo{border:0;padding:0;cursor:zoom-in;appearance:none}.avatar.photo:active{transform:scale(.97)}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-size:26px;line-height:1;font-weight:950;letter-spacing:-.04em}.meta{font-size:12px;color:var(--muted);margin-top:6px}.lost{display:inline-flex;margin-top:8px;padding:6px 9px;border-radius:999px;background:#fff0f2;color:#b02c3a;font-size:10px;font-weight:950}.where{margin-top:13px;padding:12px 13px;border-radius:16px;background:#fbf6ef;border:1px solid var(--line);font-size:13px;line-height:1.45}.when{font-size:11px;color:var(--muted);margin-top:5px}.wa{width:100%;min-height:49px;margin-top:12px;border-radius:16px;background:#e9f4ed;color:#1c6845;border:1px solid #cfe5d7;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}.nocontact{margin-top:12px;padding:12px;border-radius:15px;background:#f1ece5;color:var(--muted);font-size:12px;text-align:center;font-weight:800}.empty,.error{padding:25px 18px;text-align:center;color:var(--muted)}.loading{text-align:center;padding:35px;color:var(--muted)}
.photo-modal{position:fixed;z-index:100;inset:0;background:rgba(12,12,12,.88);display:flex;align-items:center;justify-content:center;padding:18px}.photo-modal.hidden{display:none}.photo-modal img{display:block;max-width:min(96vw,760px);max-height:84dvh;width:auto;height:auto;object-fit:contain;border-radius:20px;box-shadow:0 22px 70px rgba(0,0,0,.45)}.photo-close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.94);color:#191919;font-size:26px;line-height:1;display:grid;place-items:center;cursor:pointer}.photo-caption{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:14px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.5)}
@media(max-width:450px){h1{font-size:32px}.avatar{width:74px;height:74px;flex-basis:74px}.name{font-size:24px}.photo-modal{padding:10px}.photo-modal img{max-width:96vw;max-height:82dvh;border-radius:16px}}
</style>
<style id="pac-brand-logo-v1">
.logo{
  background-image:url('/mi-cuenta/icons/icon-192.png')!important;
  background-repeat:no-repeat!important;
  background-position:center -4px!important;
  background-size:78px 78px!important;
  background-color:transparent!important;
  box-shadow:none!important;
  color:transparent!important;
  font-size:0!important;
  overflow:hidden!important;
  border-radius:14px!important;
}
.logo::before{display:none!important;content:none!important}
</style>
<link rel="stylesheet" href="/geist.css">
</head>
<body>
<main class="app">
  <header class="top"><div class="brand"><div class="logo"></div><span>Patas a Casa</span></div><a class="back" href="/mi-cuenta/">← Mi cuenta</a></header>
  <section class="hero"><div class="kicker">COMUNIDAD</div><h1>Mascotas perdidas</h1><p class="muted small">Acá aparecen solamente las mascotas que su dueño marcó como perdidas.</p></section>
  <div id="root" class="loading">Cargando mascotas perdidas…</div>
</main>
<div id="photoModal" class="photo-modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Foto ampliada de la mascota">
  <button id="photoClose" class="photo-close" type="button" aria-label="Cerrar foto">×</button>
  <img id="photoLarge" alt="">
  <div id="photoCaption" class="photo-caption"></div>
</div>
<script>
const SUPABASE_URL="https://cgciwutqwnssdphugupq.supabase.co";
const PUBLISHABLE_KEY="sb_publishable_oozsLV8QMoy_ooLIqgh_qg_vvjV6IY5";
const API=SUPABASE_URL+"/functions/v1/patas-lost-community";
const root=document.getElementById("root"),photoModal=document.getElementById("photoModal"),photoLarge=document.getElementById("photoLarge"),photoCaption=document.getElementById("photoCaption"),photoClose=document.getElementById("photoClose");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function when(v){if(!v)return"";const d=new Date(v);if(Number.isNaN(d.getTime()))return"";return d.toLocaleString("es-AR",{dateStyle:"medium",timeStyle:"short"})}
function openPhoto(src,name){photoLarge.src=src;photoLarge.alt=`Foto ampliada de ${name||"la mascota"}`;photoCaption.textContent=name||"";photoModal.classList.remove("hidden");photoModal.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";photoClose.focus()}
function closePhoto(){photoModal.classList.add("hidden");photoModal.setAttribute("aria-hidden","true");photoLarge.removeAttribute("src");photoCaption.textContent="";document.body.style.overflow=""}
function card(p){const meta=[p.breed||p.species,p.age_text].filter(Boolean).join(" · ");const dt=when(p.lost_at);const msg=encodeURIComponent(`Hola, vi a ${p.name} en Mascotas perdidas de Patas a Casa.`);const avatar=p.photo_url?`<button class="avatar photo" type="button" data-photo="${esc(p.photo_url)}" data-name="${esc(p.name)}" aria-label="Agrandar foto de ${esc(p.name)}"><img src="${esc(p.photo_url)}" alt="Foto de ${esc(p.name)}"></button>`:`<div class="avatar">${p.species==="Gato"?"🐱":"🐶"}</div>`;return `<article class="pet"><div class="head">${avatar}<div><div class="name">${esc(p.name)}</div><div class="meta">${esc(meta||"Mascota")}</div><span class="lost">🚨 PERDIDO</span></div></div><div class="where"><b>📍 Se perdió en:</b> ${esc(p.lost_location||"Zona no informada")}${dt?`<div class="when">🕒 ${esc(dt)}</div>`:""}</div>${p.whatsapp?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${esc(p.whatsapp)}?text=${msg}">💬 Contactar por WhatsApp</a>`:`<div class="nocontact">Contacto no publicado</div>`}</article>`}
root.addEventListener("click",e=>{const trigger=e.target.closest("[data-photo]");if(trigger)openPhoto(trigger.dataset.photo,trigger.dataset.name)});
photoClose.addEventListener("click",closePhoto);
photoModal.addEventListener("click",e=>{if(e.target===photoModal)closePhoto()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!photoModal.classList.contains("hidden"))closePhoto()});
async function load(){try{const r=await fetch(API,{headers:{apikey:PUBLISHABLE_KEY},cache:"no-store"});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"No se pudieron cargar las mascotas perdidas.");const pets=j.pets||[];root.className="list";root.innerHTML=pets.length?pets.map(card).join(""):`<div class="empty">No hay mascotas marcadas como perdidas en este momento.</div>`}catch(err){root.className="error";root.innerHTML=`No pudimos cargar la lista.<br><span class="small">${esc(err.message)}</span>`}}
load();
</script>
</body>
</html>
