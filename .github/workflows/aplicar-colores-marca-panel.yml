name: Aplicar colores de marca al panel

on:
  push:
    paths:
      - '.github/workflows/aplicar-colores-marca-panel.yml'

permissions:
  contents: write

jobs:
  brand-colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar colores de marca
        run: python scripts/aplicar_colores_marca_panel.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re
          html=open('mi-cuenta/index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          open('/tmp/patas-account.js','w',encoding='utf-8').write('\n'.join(scripts))
          print('scripts:',len(scripts),'bytes:',sum(map(len,scripts)))
          PY
          node --check /tmp/patas-account.js
      - name: Validar estilo de marca
        run: |
          grep -q 'pac-brand-colors-v1' mi-cuenta/index.html
          grep -q -- '--pac-teal:#0a7f83' mi-cuenta/index.html
          grep -q "content:'⌄'" mi-cuenta/index.html
          grep -q '.tag-code{color:#716b65' mi-cuenta/index.html
      - name: Commit colores de marca
        run: |
          if git diff --quiet -- mi-cuenta/index.html; then
            echo 'No hay cambios para aplicar.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-cuenta/index.html
          git commit -m 'Integrar colores de marca al panel responsable'
          git push
