name: Add lost pet details

on:
  push:
    paths:
      - 'scripts/add_lost_details.py'
      - '.github/workflows/add-lost-details.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply lost details patch
        run: python scripts/add_lost_details.py

      - name: Commit generated changes
        run: |
          if git diff --quiet -- index.html mi-cuenta/index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mi-cuenta/index.html
          git commit -m "Add lost location and time flow"
          git push
