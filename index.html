<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171719">
<title>Patas a Casa</title>
<style>
:root{
  --bg:#f4f4f1;--card:#fff;--ink:#171719;--muted:#737373;--line:#e8e7e2;
  --orange:#ff6a36;--orange2:#ff8c65;--green:#1f9d61;--red:#db4051;
  --shadow:0 20px 60px rgba(20,20,20,.08);--r:28px
}
*{box-sizing:border-box}html{background:var(--bg)}body{
  margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 50% -10%,#fff 0,#f7f7f4 38%,#f2f2ef 100%);
}
button,input,textarea,select{font:inherit}.app{max-width:590px;margin:auto;padding:16px 15px 70px}
.header{display:flex;align-items:center;justify-content:space-between;margin:3px 2px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:-.03em}
.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:15px;background:#171719;color:#fff}
.demo{font-size:10px;font-weight:900;letter-spacing:.08em;color:#696969;background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:999px}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:var(--r);padding:21px;box-shadow:var(--shadow);margin-bottom:13px}
.hero{padding:24px}.kicker{font-size:11px;letter-spacing:.08em;font-weight:950;color:#ce4d20}
h1{font-size:37px;line-height:1;letter-spacing:-.055em;margin:10px 0 12px}h2{font-size:21px;letter-spacing:-.03em;margin:0 0 12px}
p{line-height:1.5}.muted{color:var(--muted)}.small{font-size:12px}
.btn{width:100%;appearance:none;border:0;border-radius:17px;padding:14px 15px;font-weight:900;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.55}.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;box-shadow:0 12px 25px rgba(255,106,54,.22)}
.dark{background:#171719;color:#fff}.soft{background:#f2f2f0;color:#2d2d30}.green{background:#eaf8ef;color:#176f45;border:1px solid #ccebd7}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stack{display:grid;gap:9px}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px;color:#47474c}
.field input,.field textarea,.field select{width:100%;border:1px solid #deded9;background:#fff;border-radius:14px;padding:13px;color:var(--ink);outline:none}
.field textarea{min-height:84px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#f2a081;box-shadow:0 0 0 3px rgba(255,106,54,.09)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pin{font-size:22px;letter-spacing:.12em;text-align:center;font-weight:900}
.stepbar{display:flex;gap:6px;margin:15px 0 2px}.step{height:5px;flex:1;border-radius:99px;background:#e9e8e4}.step.on{background:var(--orange)}
.note{padding:13px 14px;border-radius:16px;background:#fafaf8;border:1px solid var(--line);font-size:12px;color:#68686d;line-height:1.45}
.optional{margin-top:13px;border-top:1px solid var(--line);padding-top:13px}.optional summary{cursor:pointer;font-weight:900;font-size:13px;padding:5px 0 12px}
.check{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);background:#fafaf8;border-radius:15px;padding:11px;margin:10px 0}.check input{margin-top:3px}
.status{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:950;letter-spacing:.03em;background:#edf8f2;color:#147145;border:1px solid #c9ead7}
.status.lost{background:#fff0f2;color:#b02c3a;border-color:#ffd1d7}
.petrow{display:flex;align-items:center;gap:15px;margin-top:16px}.avatar{width:100px;height:100px;flex:0 0 100px;border-radius:26px;background:linear-gradient(145deg,#fff1e9,#ffe1d2);display:grid;place-items:center;font-size:49px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.photo-pick{display:flex;align-items:center;gap:14px;padding:13px;border:1px solid var(--line);border-radius:18px;background:#fafaf8;margin-bottom:16px}.photo-preview{width:92px;height:92px;flex:0 0 92px;border-radius:23px;background:linear-gradient(145deg,#fff1e9,#ffe1d2);display:grid;place-items:center;font-size:40px;overflow:hidden}.photo-preview img{width:100%;height:100%;object-fit:cover;display:block}.photo-actions{display:grid;gap:7px;flex:1}.file-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #deded9;background:#fff;border-radius:13px;padding:10px 12px;font-size:12px;font-weight:900;cursor:pointer}.file-btn input{display:none}
.avatar.has-photo{cursor:zoom-in}
.photo-lightbox{position:fixed;z-index:9999;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:18px;animation:photoFadeIn .15s ease}
.photo-lightbox img{max-width:100%;max-height:88vh;width:auto;height:auto;object-fit:contain;border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.45)}
.photo-lightbox-close{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:30px;line-height:1;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.photo-lightbox-hint{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:rgba(255,255,255,.78);font-size:12px;white-space:nowrap}
@keyframes photoFadeIn{from{opacity:0}to{opacity:1}}
.petname{font-size:32px;font-weight:950;letter-spacing:-.045em;line-height:1}.meta{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.4}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:11px;font-weight:800;padding:7px 9px;border-radius:999px;background:#f2f2f0}
.box{padding:14px 15px;border:1px solid var(--line);background:#fafaf8;border-radius:17px;margin-top:9px;line-height:1.45}.box strong{display:block;font-size:12px;margin-bottom:4px}
.warn{background:#fff7f4;border-color:#ffdfd1}.owner{margin-top:8px;text-align:center}.owner button{border:0;background:none;color:#7b7b80;text-decoration:underline;font-size:12px;cursor:pointer}
.hidden{display:none!important}.loading{text-align:center;color:var(--muted);padding:38px}.toast{position:fixed;z-index:20;left:50%;bottom:22px;transform:translateX(-50%);background:#171719;color:#fff;padding:12px 15px;border-radius:15px;box-shadow:0 14px 40px rgba(0,0,0,.22);font-size:13px;max-width:90%}
@media(max-width:450px){h1{font-size:34px}.split,.actions{grid-template-columns:1fr}.avatar{width:86px;height:86px;flex-basis:86px;border-radius:22px}.petname{font-size:28px}}
</style>
</head>
<body>
<div class="app">
  <header class="header"><div class="brand"><div class="logo">🐾</div><span>Patas a Casa</span></div><div style="display:flex;align-items:center;gap:7px"><a class="demo" style="text-decoration:none;color:#333" href="/mi-cuenta/">Mi cuenta</a><span class="demo">PRUEBA</span></div></header>
  <main id="root"><div class="card loading">Cargando…</div></main>
</div>
<script>
const API="https://cgciwutqwnssdphugupq.supabase.co/functions/v1/patas-api";
const root=document.getElementById("root");
const path=location.pathname;
const params=new URLSearchParams(location.search);
const code=(params.get('tag')||(path.match(/^\/t\/([A-Za-z0-9]+)/)||[])[1]||'').toUpperCase();

function esc(v=""){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function tel(v=""){return String(v??"").replace(/[^\d+]/g,"")}
function wa(v=""){return String(v??"").replace(/\D/g,"")}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
function openPhotoViewer(src,name=""){
 const old=document.getElementById("photoLightbox");if(old)old.remove();
 const overlay=document.createElement("div");overlay.id="photoLightbox";overlay.className="photo-lightbox";
 const img=document.createElement("img");img.src=src;img.alt="Foto ampliada de "+name;
 const closeBtn=document.createElement("button");closeBtn.type="button";closeBtn.className="photo-lightbox-close";closeBtn.setAttribute("aria-label","Cerrar foto");closeBtn.textContent="×";
 const hint=document.createElement("div");hint.className="photo-lightbox-hint";hint.textContent="Tocá afuera para cerrar";
 const onKey=e=>{if(e.key==="Escape")close()};
 const close=()=>{document.removeEventListener("keydown",onKey);document.body.style.overflow="";overlay.remove()};
 closeBtn.addEventListener("click",close);overlay.addEventListener("click",e=>{if(e.target===overlay)close()});document.addEventListener("keydown",onKey);
 overlay.append(img,closeBtn,hint);document.body.appendChild(overlay);document.body.style.overflow="hidden";
}
function getCurrentLocation(){
 return new Promise(resolve=>{
   if(!navigator.geolocation){resolve({ok:false,message:"Este navegador no permite compartir ubicación."});return}
   navigator.geolocation.getCurrentPosition(
     pos=>resolve({ok:true,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy}),
     err=>{
       const messages={1:"No diste permiso para usar tu ubicación.",2:"El celular no pudo determinar tu ubicación.",3:"La ubicación tardó demasiado en responder."};
       resolve({ok:false,message:messages[err.code]||"No pudimos obtener tu ubicación."});
     },
     {enableHighAccuracy:false,timeout:15000,maximumAge:60000}
   );
 });
}

function compressPhoto(file){
 return new Promise((resolve,reject)=>{
   if(!file){resolve(null);return}
   if(!file.type.startsWith("image/")){reject(new Error("Elegí una imagen válida."));return}
   if(file.size>12*1024*1024){reject(new Error("La foto original es demasiado grande."));return}
   const reader=new FileReader();
   reader.onerror=()=>reject(new Error("No pudimos leer la foto."));
   reader.onload=()=>{
     const img=new Image();
     img.onerror=()=>reject(new Error("No pudimos procesar esa foto. Probá con JPG o PNG."));
     img.onload=()=>{
       const max=900,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
       const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
       const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
       const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
       resolve(canvas.toDataURL("image/jpeg",.82));
     };
     img.src=String(reader.result);
   };
   reader.readAsDataURL(file);
 });
}
function bindPhotoPreview(inputId,previewId){
 const input=document.getElementById(inputId),preview=document.getElementById(previewId);if(!input||!preview)return;
 input.addEventListener("change",()=>{
   const file=input.files?.[0];if(!file)return;
   const url=URL.createObjectURL(file);preview.innerHTML=`<img src="${url}" alt="Vista previa">`;
 });
}

async function getTag(c){const r=await fetch(API+"?action=tag&code="+encodeURIComponent(c));const j=await r.json();if(!r.ok)throw new Error(j.error||"No pudimos abrir esta chapita");return j}
async function post(data){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||"Ocurrió un error");return j}

function home(){
 root.innerHTML=`<section class="card hero"><div class="kicker">IDENTIFICACIÓN SIMPLE</div><h1>Un QR. Una chapita. Siempre la misma.</h1><p class="muted">El QR de la chapita decide automáticamente qué mostrar: activación si es nueva, o el perfil de la mascota si ya está configurada.</p><div class="note">Para probar esta versión, usá la chapita demo <b>K7M4XA</b>.</div><a class="btn dark" style="margin-top:12px" href="?tag=K7M4XA">Abrir chapita demo</a><a class="btn soft" style="margin-top:9px" href="/mi-cuenta/">👤 Mi cuenta del responsable</a></section>`;
}

function unactivated(c){
 root.innerHTML=`<section class="card hero">
   <div class="kicker">CHAPITA NUEVA</div>
   <h1>Activá tu chapita 🐾</h1>
   <p class="muted">Te va a llevar menos de un minuto. El PIN viene con la chapita y se usa para comprobar que es tuya.</p>
   <div class="stepbar"><div class="step on"></div><div class="step"></div></div>
 </section>
 <section class="card">
   <form id="pinForm">
     <div class="field"><label>PIN de activación</label><input class="pin" name="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="••••••••" required></div>
     <button class="btn primary" id="continue" type="submit">Continuar</button>
   </form>
   <p class="small muted" style="text-align:center;margin-bottom:0">Código de chapita: ${esc(c)}</p>
 </section>`;
 document.getElementById("pinForm").addEventListener("submit",async e=>{
   e.preventDefault();const pin=new FormData(e.currentTarget).get("pin"),b=document.getElementById("continue");b.disabled=true;b.textContent="Verificando…";
   try{await post({action:"verify_pin",public_code:c,activation_code:pin}); activationForm(c,String(pin));}
   catch(err){toast(err.message);b.disabled=false;b.textContent="Continuar"}
 });
}

function activationForm(c,pin){
 root.innerHTML=`<section class="card hero">
   <div class="kicker">ÚLTIMO PASO</div>
   <h1>¿Quién lleva esta chapita?</h1>
   <p class="muted">Cargá lo indispensable. La foto y los datos se pueden cambiar más adelante.</p>
   <div class="stepbar"><div class="step on"></div><div class="step on"></div></div>
 </section>
 <section class="card">
   <form id="activate">
     <div class="photo-pick"><div class="photo-preview" id="activationPhotoPreview">🐾</div><div class="photo-actions"><b>Foto de tu mascota</b><span class="small muted">Ayuda muchísimo a reconocerla rápido.</span><label class="file-btn">📷 Elegir foto<input id="activationPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/*"></label></div></div>
     <div class="split"><div class="field"><label>Nombre de tu mascota</label><input name="name" placeholder="Rocco" maxlength="80" required></div><div class="field"><label>Especie</label><select name="species"><option>Perro</option><option>Gato</option><option>Otra</option></select></div></div>
     <div class="split"><div class="field"><label>Tu nombre</label><input name="contact_name" placeholder="Nombre del responsable" maxlength="80" required></div><div class="field"><label>WhatsApp / teléfono</label><input name="contact_whatsapp" inputmode="tel" placeholder="+54 9 261..." maxlength="40" required></div></div>
     <div class="split"><div class="field"><label>Raza</label><input name="breed" placeholder="Opcional" maxlength="80"></div><div class="field"><label>Edad</label><input name="age_text" placeholder="Ej. 4 años" maxlength="40"></div></div>
     <div class="split"><div class="field"><label>Sexo</label><select name="sex"><option value="">Sin informar</option><option>Macho</option><option>Hembra</option></select></div><div class="field"><label>Tamaño</label><select name="size"><option value="">Sin informar</option><option>Pequeño</option><option>Mediano</option><option>Grande</option></select></div></div>
     <div class="field"><label>Color / señas</label><input name="color" placeholder="Ej. Dorado, mancha blanca en el pecho" maxlength="80"></div>
     <details class="optional"><summary>❤️ Agregar salud y cuidados (opcional)</summary>
       <div class="field"><label>Enfermedades</label><textarea name="diseases" placeholder="Ej. Epilepsia"></textarea></div>
       <div class="field"><label>Medicamentos</label><textarea name="medications" placeholder="Nombre y dosis"></textarea></div>
       <div class="field"><label>Frecuencia</label><input name="medication_schedule" placeholder="Ej. Cada 12 horas"></div>
       <div class="field"><label>Alergias</label><textarea name="allergies"></textarea></div>
       <div class="field"><label>Cuidados especiales</label><textarea name="special_care"></textarea></div>
       <div class="field"><label>Veterinario / dato útil</label><textarea name="vet_info" placeholder="Opcional"></textarea></div>
     </details>
     <label class="check"><input name="public_health" type="checkbox" checked><div><b>Mostrar datos importantes de salud</b><div class="small muted">Sirve para que quien lo encuentre pueda cuidarlo correctamente.</div></div></label>
     <button class="btn primary" id="activateBtn" type="submit">Activar chapita</button>
   </form>
 </section>`;
 bindPhotoPreview("activationPhoto","activationPhotoPreview");
 document.getElementById("activate").addEventListener("submit",async e=>{
   e.preventDefault();const f=new FormData(e.currentTarget),o=Object.fromEntries(f.entries()),b=document.getElementById("activateBtn"),photo=document.getElementById("activationPhoto").files?.[0];
   o.action="activate";o.public_code=c;o.activation_code=pin;o.contact_phone=o.contact_whatsapp;o.public_health=f.get("public_health")==="on";o.public_contact=true;o.status="normal";
   b.disabled=true;
   try{if(photo){b.textContent="Preparando foto…";o.photo_data=await compressPhoto(photo)}b.textContent="Activando…";await post(o);toast("Chapita activada ✅");setTimeout(()=>location.href="?tag="+encodeURIComponent(c),500)}
   catch(err){toast(err.message);b.disabled=false;b.textContent="Activar chapita"}
 });
}

function active(c,p){
 const lost=p.status==="perdido",phone=tel(p.contact_phone),whats=wa(p.contact_whatsapp||p.contact_phone);
 const health=p.public_health&&(p.diseases||p.medications||p.allergies||p.special_care||p.vet_info)?`<section class="card"><h2>❤️ Salud y cuidados</h2>${p.diseases?`<div class="box warn"><strong>Enfermedades</strong>${esc(p.diseases)}</div>`:""}${p.medications?`<div class="box"><strong>Medicación</strong>${esc(p.medications)}${p.medication_schedule?" · "+esc(p.medication_schedule):""}</div>`:""}${p.allergies?`<div class="box"><strong>Alergias</strong>${esc(p.allergies)}</div>`:""}${p.special_care?`<div class="box"><strong>Cuidados especiales</strong>${esc(p.special_care)}</div>`:""}${p.vet_info?`<div class="box"><strong>Veterinario / dato útil</strong>${esc(p.vet_info)}</div>`:""}</section>`:"";
 root.innerHTML=`<section class="card hero">
   <span class="status ${lost?"lost":""}">● ${lost?"MI FAMILIA ME ESTÁ BUSCANDO":"IDENTIFICADO"}</span>
   <div class="petrow"><div class="avatar ${p.photo_url?"has-photo":""}">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="Foto de ${esc(p.name)}">`:p.species==="Gato"?"🐱":"🐶"}</div><div><div class="petname">${esc(p.name)}</div><div class="meta">${esc(p.breed||p.species)}${p.sex?" · "+esc(p.sex):""}${p.age_text?" · "+esc(p.age_text):""}</div><div class="chips">${p.size?`<span class="chip">${esc(p.size)}</span>`:""}${p.color?`<span class="chip">${esc(p.color)}</span>`:""}</div></div></div>
   ${lost?`<div class="box warn"><strong>🚨 Está perdido</strong>Si lo encontraste, contactá a su familia o avisá dónde lo viste.</div>`:""}
 </section>
 ${health}
 <section class="card"><h2>Contactá a su familia</h2><div class="actions">${phone?`<a class="btn dark" href="tel:${esc(phone)}">📞 Llamar</a>`:""}${whats?`<a class="btn green" target="_blank" rel="noopener" href="https://wa.me/${esc(whats)}?text=${encodeURIComponent("Hola, encontré a "+p.name+".")}">💬 WhatsApp</a>`:""}</div></section>
 <section class="card"><h2>📍 ¿Encontraste a ${esc(p.name)}?</h2><p class="small muted">Avisá sin registrarte. Compartir ubicación es opcional.</p>
   <form id="found">
     <div class="field"><label>Mensaje</label><textarea name="message" maxlength="500" placeholder="Ej. Está conmigo en la plaza y parece estar bien."></textarea></div>
     <div class="field"><label>Zona aproximada</label><input name="area_text" maxlength="120" placeholder="Ej. Godoy Cruz, Mendoza"></div>
     <label class="check"><input id="geo" type="checkbox"><div><b>Compartir mi ubicación actual</b><div class="small muted">Tu celular te pedirá permiso. Si aceptás, se agrega un link de Google Maps al WhatsApp.</div></div></label>
     <div id="geoStatus" class="small muted" style="margin:-2px 2px 12px"></div>
     <button id="foundBtn" class="btn primary" type="submit">Avisar que encontré a ${esc(p.name)}</button>
   </form>
 </section>
 <div class="owner"><button id="ownerBtn">Soy el responsable de ${esc(p.name)}</button></div>`;
 if(p.photo_url){
   const petPhoto=document.querySelector(".avatar.has-photo");
   if(petPhoto){
     petPhoto.setAttribute("role","button");petPhoto.setAttribute("tabindex","0");petPhoto.setAttribute("aria-label","Ver foto grande de "+p.name);
     petPhoto.addEventListener("click",()=>openPhotoViewer(p.photo_url,p.name));
     petPhoto.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openPhotoViewer(p.photo_url,p.name)}});
   }
 }
 let cachedGeo=null;
 const geoInput=document.getElementById("geo"),geoStatus=document.getElementById("geoStatus");
 geoInput.addEventListener("change",async()=>{
   if(!geoInput.checked){cachedGeo=null;geoStatus.textContent="";return}
   geoStatus.textContent="📍 Obteniendo tu ubicación…";
   const result=await getCurrentLocation();
   if(result.ok){cachedGeo=result;geoStatus.textContent="✅ Ubicación lista para compartir"}
   else{cachedGeo=null;geoStatus.textContent="⚠️ "+result.message+" Podés volver a intentarlo o desmarcar esta opción."}
 });
 document.getElementById("found").addEventListener("submit",async e=>{
   e.preventDefault();
   const form=e.currentTarget,f=new FormData(form),geoWanted=geoInput.checked,b=document.getElementById("foundBtn");
   b.disabled=true;b.textContent="Enviando…";
   let g=cachedGeo;
   if(geoWanted&&!g){
     geoStatus.textContent="📍 Obteniendo tu ubicación…";
     const result=await getCurrentLocation();
     if(!result.ok){geoStatus.textContent="⚠️ "+result.message+" Podés volver a intentarlo o desmarcar esta opción.";toast(result.message);b.disabled=false;b.textContent="Avisar que encontré a "+p.name;return}
     g=result;cachedGeo=result;geoStatus.textContent="✅ Ubicación lista para compartir";
   }
   try{
     const finderMessage=String(f.get("message")||"").trim(),area=String(f.get("area_text")||"").trim();
     await post({action:"sighting",public_code:c,message:finderMessage,area_text:area,location_consent:Boolean(geoWanted&&g),latitude:g?.latitude??null,longitude:g?.longitude??null,contact_consent:false});
     const parts=["Hola, encontré a "+p.name+"."];
     if(finderMessage)parts.push(finderMessage);
     if(area)parts.push("Zona aproximada: "+area);
     if(geoWanted&&g)parts.push("📍 Mi ubicación: https://maps.google.com/?q="+g.latitude+","+g.longitude);
     parts.push("Aviso enviado desde Patas a Casa.");
     const whatsappUrl=whats?"https://wa.me/"+whats+"?text="+encodeURIComponent(parts.join("\n\n")):null;
     form.reset();cachedGeo=null;geoStatus.textContent="";
     if(whatsappUrl){toast("Aviso guardado. Abriendo WhatsApp…");setTimeout(()=>{window.location.href=whatsappUrl},350)}
     else{toast("Aviso enviado ✅")}
   }
   catch(err){toast(err.message)}finally{b.disabled=false;b.textContent="Avisar que encontré a "+p.name}
 });
 document.getElementById("ownerBtn").addEventListener("click",()=>ownerEdit(c,p));
}

function ownerEdit(c,p){
 root.innerHTML=`<section class="card hero"><div class="kicker">RESPONSABLE</div><h1>Editá el perfil.</h1><p class="muted">Usá el PIN privado para cambiar la foto, los datos o marcar a tu mascota como perdida.</p></section>
 <section class="card"><form id="ownerForm">
 <div class="field"><label>PIN privado</label><input class="pin" name="activation_code" type="password" required></div>
 <div class="photo-pick"><div class="photo-preview" id="ownerPhotoPreview">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="Foto actual">`:p.species==="Gato"?"🐱":"🐶"}</div><div class="photo-actions"><b>Foto de ${esc(p.name)}</b><span class="small muted">Podés reemplazarla cuando quieras.</span><label class="file-btn">📷 Cambiar foto<input id="ownerPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/*"></label>${p.photo_url?`<label class="small"><input id="removePhoto" type="checkbox"> Quitar foto actual</label>`:""}</div></div>
 <div class="split"><div class="field"><label>Nombre</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>Estado</label><select name="status"><option value="normal" ${p.status!=="perdido"?"selected":""}>Normal</option><option value="perdido" ${p.status==="perdido"?"selected":""}>🚨 Perdido</option></select></div></div>
 <div class="split"><div class="field"><label>Especie</label><select name="species"><option ${p.species==="Perro"?"selected":""}>Perro</option><option ${p.species==="Gato"?"selected":""}>Gato</option><option ${p.species!=="Perro"&&p.species!=="Gato"?"selected":""}>Otra</option></select></div><div class="field"><label>Raza</label><input name="breed" value="${esc(p.breed||"")}"></div></div>
 <div class="split"><div class="field"><label>Sexo</label><select name="sex"><option value="" ${!p.sex?"selected":""}>Sin informar</option><option ${p.sex==="Macho"?"selected":""}>Macho</option><option ${p.sex==="Hembra"?"selected":""}>Hembra</option></select></div><div class="field"><label>Edad</label><input name="age_text" value="${esc(p.age_text||"")}" placeholder="Ej. 4 años"></div></div>
 <div class="split"><div class="field"><label>Tamaño</label><select name="size"><option value="" ${!p.size?"selected":""}>Sin informar</option><option ${p.size==="Pequeño"?"selected":""}>Pequeño</option><option ${p.size==="Mediano"?"selected":""}>Mediano</option><option ${p.size==="Grande"?"selected":""}>Grande</option></select></div><div class="field"><label>Color / señas</label><input name="color" value="${esc(p.color||"")}"></div></div>
 <div class="split"><div class="field"><label>Responsable</label><input name="contact_name" value="${esc(p.contact_name||"")}"></div><div class="field"><label>WhatsApp / teléfono</label><input name="contact_whatsapp" inputmode="tel" value="${esc(p.contact_whatsapp||p.contact_phone||"")}"></div></div>
 <details class="optional" open><summary>❤️ Salud y cuidados</summary>
 <div class="field"><label>Enfermedades</label><textarea name="diseases">${esc(p.diseases||"")}</textarea></div><div class="field"><label>Medicamentos</label><textarea name="medications">${esc(p.medications||"")}</textarea></div><div class="field"><label>Frecuencia</label><input name="medication_schedule" value="${esc(p.medication_schedule||"")}"></div><div class="field"><label>Alergias</label><textarea name="allergies">${esc(p.allergies||"")}</textarea></div><div class="field"><label>Cuidados especiales</label><textarea name="special_care">${esc(p.special_care||"")}</textarea></div><div class="field"><label>Veterinario / dato útil</label><textarea name="vet_info">${esc(p.vet_info||"")}</textarea></div></details>
 <label class="check"><input name="public_health" type="checkbox" ${p.public_health?"checked":""}><div><b>Mostrar salud importante</b><div class="small muted">Sólo se muestra si está marcado.</div></div></label>
 <button id="saveOwner" class="btn primary" type="submit">Guardar cambios</button></form></section>`;
 bindPhotoPreview("ownerPhoto","ownerPhotoPreview");
 document.getElementById("ownerForm").addEventListener("submit",async e=>{
   e.preventDefault();const f=new FormData(e.currentTarget),o=Object.fromEntries(f.entries()),b=document.getElementById("saveOwner"),photo=document.getElementById("ownerPhoto").files?.[0];
   Object.assign(o,{action:"update_pet",public_code:c,contact_phone:o.contact_whatsapp,public_health:f.get("public_health")==="on",public_contact:true,remove_photo:Boolean(document.getElementById("removePhoto")?.checked)});
   b.disabled=true;
   try{if(photo){b.textContent="Preparando foto…";o.photo_data=await compressPhoto(photo);o.remove_photo=false}b.textContent="Guardando…";await post(o);toast("Cambios guardados ✅");setTimeout(()=>location.href="?tag="+encodeURIComponent(c),500)}
   catch(err){toast(err.message);b.disabled=false;b.textContent="Guardar cambios"}
 });
}

async function boot(){
 if(!code){home();return}
 root.innerHTML='<section class="card loading">Leyendo chapita…</section>';
 try{const data=await getTag(code);if(data.state==="unactivated")unactivated(code);else active(code,data.pet)}
 catch(err){root.innerHTML=`<section class="card"><h2>No pudimos abrir esta chapita</h2><p class="muted">${esc(err.message)}</p></section>`}
}
boot();
</script>
</body>
