<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f1e9"><title>Activar chapita · Patas a Casa</title>
<style>:root{--bg:#f6f1e9;--card:#fffdfa;--ink:#181817;--muted:#756e65;--line:rgba(49,39,31,.10);--orange:#ff6a36;--orange2:#ff8557;--red:#a93442;--shadow:0 14px 38px rgba(53,38,25,.09)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#faf7f2 0,var(--bg) 55%,#f3ede5 100%)}.app{max-width:520px;margin:auto;padding:18px 13px 80px}.brand{display:flex;align-items:center;gap:10px;font-weight:950;margin:2px 2px 18px}.brand img{width:44px;height:44px}.card{background:rgba(255,253,250,.97);border:1px solid var(--line);border-radius:23px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}.kicker{font-size:10px;letter-spacing:.1em;font-weight:950;color:#bd4d26}.hero h1{font-size:34px;line-height:1.02;letter-spacing:-.05em;margin:9px 0 11px}.muted{color:var(--muted);line-height:1.5}.note{padding:13px 14px;border:1px solid var(--line);border-radius:16px;background:#fbf6ef;font-size:13px;line-height:1.45}.ok{background:#e9f4ed;color:#1c6845}.err{background:#fff0f2;color:var(--red)}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.field input,.field select{width:100%;min-height:50px;border:1px solid rgba(60,48,38,.14);border-radius:15px;background:#fff;padding:13px;font-size:16px;outline:none}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;min-height:50px;border:0;border-radius:16px;padding:13px 15px;font-weight:900;cursor:pointer;margin-top:12px}.btn:disabled{opacity:.55}.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff}.soft{background:#f1ece5;color:#2c2824}.small{font-size:12px}.stepbar{display:flex;gap:6px;margin:15px 0 2px}.step{height:5px;flex:1;border-radius:99px;background:#e9e8e4}.step.on{background:var(--orange)}.hidden{display:none!important}.photo{display:flex;align-items:center;gap:12px;margin-top:15px}.preview{width:76px;height:76px;border-radius:20px;background:#ffe7dc;display:grid;place-items:center;font-size:34px;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.file{display:inline-flex;padding:9px 11px;border-radius:12px;background:#fff;border:1px solid #ddd;font-size:12px;font-weight:900;cursor:pointer}.file input{display:none}@media(max-width:420px){.split{grid-template-columns:1fr}}</style>
</head>
<body><div class="app"><div class="brand"><img src="/assets/logo-patas-a-casa-marca.svg" alt=""><span>Patas a Casa</span></div><main id="root"><section class="card">Cargando…</section></main></div>
<script>
const root=document.getElementById('root'),params=new URLSearchParams(location.search),tag=String(params.get('tag')||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12),SESSION_KEY='pac_owner_session_v1',PENDING_KEY='pac_google_activation_v1';let activationCode='',cfg=null;
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function config(){if(cfg)return cfg;const html=await fetch('/mi-cuenta/',{cache:'no-store'}).then(r=>r.text()),pick=n=>{const m=html.match(new RegExp('const '+n+'=([^;]+);'));if(!m)throw new Error('No pudimos cargar la configuración.');return Function('return ('+m[1]+')')()};cfg={SUPABASE_URL:pick('SUPABASE_URL'),PUBLISHABLE_KEY:pick('PUBLISHABLE_KEY')};cfg.AUTH=cfg.SUPABASE_URL+'/auth/v1';cfg.SHARED_API=cfg.SUPABASE_URL+'/functions/v1/patas-shared-activation';cfg.ACCOUNT_API=cfg.SUPABASE_URL+'/functions/v1/patas-account';return cfg}
function setSession(s){if(!s){localStorage.removeItem(SESSION_KEY);return}if(!s.expires_at&&s.expires_in)s.expires_at=Math.floor(Date.now()/1000)+Number(s.expires_in);localStorage.setItem(SESSION_KEY,JSON.stringify(s))}function getSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}
async function authPost(path,body){const c=await config(),r=await fetch(c.AUTH+path,{method:'POST',headers:{'Content-Type':'application/json',apikey:c.PUBLISHABLE_KEY},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||j.error||'No pudimos ingresar.');return j}
async function validSession(){let s=getSession();if(!s?.access_token)return null;const now=Math.floor(Date.now()/1000);if(s.expires_at&&s.expires_at-now>90)return s;if(!s.refresh_token){setSession(null);return null}try{s=await authPost('/token?grant_type=refresh_token',{refresh_token:s.refresh_token});setSession(s);return s}catch{setSession(null);return null}}
async function apiPost(url,data,auth=false){const c=await config(),s=auth?await validSession():null,h={'Content-Type':'application/json',apikey:c.PUBLISHABLE_KEY};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(data)}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'No pudimos continuar.');return j}async function sharedPost(d,a=false){const c=await config();return apiPost(c.SHARED_API,d,a)}async function accountPost(d){const c=await config();return apiPost(c.ACCOUNT_API,d,true)}
function readPending(){try{const p=JSON.parse(sessionStorage.getItem(PENDING_KEY)||'null');return p&&p.public_code===tag&&p.activation_method==='shared'&&Date.now()-Number(p.created_at)<15*60*1000?p:null}catch{return null}}function savePending(code){const p={public_code:tag,activation_code:code,activation_method:'shared',created_at:Date.now()};sessionStorage.setItem(PENDING_KEY,JSON.stringify(p));return p}function clearPending(){sessionStorage.removeItem(PENDING_KEY)}function showError(m){const e=document.getElementById('error');if(e){e.textContent=m;e.classList.remove('hidden')}}
async function compressPhoto(file){return new Promise((resolve,reject)=>{if(!file){resolve(null);return}const rd=new FileReader();rd.onerror=()=>reject(new Error('No pudimos leer la foto.'));rd.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('No pudimos procesar la foto.'));img.onload=()=>{const max=900,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',.82))};img.src=String(rd.result)};rd.readAsDataURL(file)})}
function showCode(){root.innerHTML=`<section class="card hero"><div class="kicker">CHAPITA NUEVA</div><h1>Activá tu chapita 🐾</h1><p class="muted">Te va a llevar menos de un minuto. Ingresá el código de activación que vino con la chapita para comprobar que es tuya.</p><div class="stepbar"><div class="step on"></div><div class="step"></div><div class="step"></div><div class="step"></div></div></section><section class="card"><div id="error" class="note err hidden"></div><form id="codeForm"><div class="field"><label>Código de activación</label><input name="code" autocapitalize="characters" autocomplete="off" maxlength="16" required></div><button class="btn primary">Continuar</button></form></section>`;document.getElementById('codeForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter,c=String(new FormData(e.currentTarget).get('code')||'').trim().toUpperCase().replace(/\s+/g,'');b.disabled=true;b.textContent='Verificando…';try{await sharedPost({action:'validate_code',public_code:tag,activation_code:c});activationCode=c;savePending(c);afterCode()}catch(err){showError(err.message);b.disabled=false;b.textContent='Continuar'}}}
async function showLogin(){root.innerHTML=`<section class="card hero"><div class="kicker">NUEVA CHAPITA</div><h1>Vinculala a tu cuenta.</h1><p class="muted">Si ya tenés Patas a Casa, ingresá con <b>la misma cuenta</b>. Así esta chapita se agrega como una mascota nueva.</p></section><section class="card"><div id="error" class="note err hidden"></div><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Contraseña</label><input name="password" type="password" minlength="8" required></div><button class="btn primary">Entrar y continuar</button></form><button class="btn soft" id="newAccount">Todavía no tengo cuenta</button><p class="small muted" style="text-align:center">No crees otra cuenta si ya tenés una mascota cargada.</p></section>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter,f=new FormData(e.currentTarget);b.disabled=true;b.textContent='Ingresando…';try{const s=await authPost('/token?grant_type=password',{email:String(f.get('email')||'').trim(),password:String(f.get('password')||'')});setSession(s);showConfirm()}catch(err){showError(err.message);b.disabled=false;b.textContent='Entrar y continuar'}};document.getElementById('newAccount').onclick=()=>{savePending(activationCode);location.href='/mi-cuenta/'}}
async function showConfirm(){const s=await validSession();if(!s)return showLogin();const email=s.user?.email||'tu cuenta';root.innerHTML=`<section class="card hero"><div class="kicker">NUEVA CHAPITA</div><h1>Chapita detectada 🐾</h1><p class="muted">El QR identifica la chapita <b>${esc(tag)}</b>.</p></section><section class="card"><div id="error" class="note err hidden"></div><div class="note ok"><b>Código correcto ✅</b></div><h2>¿Querés vincular esta chapita a esta cuenta?</h2><div class="note"><b>Cuenta:</b> ${esc(email)}</div><button class="btn primary" id="confirm">Vincular a mi cuenta</button><button class="btn soft" id="cancel">Cancelar</button></section>`;document.getElementById('confirm').onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Vinculando…';try{const r=await sharedPost({action:'prepare_activation',public_code:tag,activation_code:activationCode},true);if(r.profile_required)return showProfile();clearPending();location.href='/mi-cuenta/'}catch(err){showError(err.message);b.disabled=false;b.textContent='Vincular a mi cuenta'}};document.getElementById('cancel').onclick=()=>{clearPending();location.href='/mi-cuenta/'}}
function showProfile(){root.innerHTML=`<section class="card hero"><div class="kicker">ÚLTIMO PASO</div><h1>Creá el perfil de tu mascota.</h1><p class="muted">Esta será la mascota asociada a la chapita <b>${esc(tag)}</b>.</p></section><section class="card"><div id="error" class="note err hidden"></div><form id="profileForm"><div class="photo"><div class="preview" id="preview">🐾</div><div><b>Foto de tu mascota</b><div class="small muted">Opcional.</div><label class="file">📷 Elegir foto<input id="photo" type="file" accept="image/*"></label></div></div><div class="split"><div class="field"><label>Nombre de tu mascota</label><input name="name" maxlength="80" required></div><div class="field"><label>Especie</label><select name="species"><option>Perro</option><option>Gato</option><option>Otra</option></select></div></div><div class="split"><div class="field"><label>Tu nombre</label><input name="contact_name" maxlength="80" required></div><div class="field"><label>WhatsApp / teléfono</label><input name="contact_whatsapp" inputmode="tel" maxlength="40" required></div></div><div class="split"><div class="field"><label>Raza</label><input name="breed" maxlength="80"></div><div class="field"><label>Edad</label><input name="age_text" maxlength="40"></div></div><div class="split"><div class="field"><label>Sexo</label><select name="sex"><option value="">Sin informar</option><option>Macho</option><option>Hembra</option></select></div><div class="field"><label>Tamaño</label><select name="size"><option value="">Sin informar</option><option>Pequeño</option><option>Mediano</option><option>Grande</option></select></div></div><div class="field"><label>Color / señas</label><input name="color" maxlength="160"></div><button class="btn primary">Crear mascota y terminar</button></form></section>`;const photo=document.getElementById('photo'),prev=document.getElementById('preview');photo.onchange=()=>{const f=photo.files?.[0];if(f)prev.innerHTML=`<img src="${URL.createObjectURL(f)}" alt="Vista previa">`};document.getElementById('profileForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter,f=new FormData(e.currentTarget),o=Object.fromEntries(f.entries());Object.assign(o,{action:'complete_activation',public_code:tag,contact_phone:o.contact_whatsapp,public_health:true,public_contact:true,status:'normal'});b.disabled=true;b.textContent='Creando mascota…';try{const img=photo.files?.[0];if(img){b.textContent='Preparando foto…';o.photo_data=await compressPhoto(img);b.textContent='Creando mascota…'}await accountPost(o);clearPending();root.innerHTML=`<section class="card hero"><div class="kicker">LISTO</div><h1>Chapita vinculada ✅</h1><p class="muted">La nueva mascota ya quedó agregada a tu cuenta.</p><button class="btn primary" id="finish">Ir a Mi cuenta</button></section>`;document.getElementById('finish').onclick=()=>location.href='/mi-cuenta/'}catch(err){showError(err.message);b.disabled=false;b.textContent='Crear mascota y terminar'}}}
async function afterCode(){savePending(activationCode);location.replace('/mi-cuenta/')}async function boot(){if(!tag){root.innerHTML='<section class="card"><div class="note err">No pudimos identificar esta chapita.</div></section>';return}const p=readPending();if(p?.activation_code){activationCode=String(p.activation_code);return afterCode()}showCode()}boot();
</script></body></html>
