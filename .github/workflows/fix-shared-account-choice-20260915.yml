name: Fix shared account choice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shared-account-choice-20260915.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch account choice
        run: python .github/scripts/fix_shared_account_choice_20260915.py

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "patas-a-casa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mi-cuenta/index.html
          git commit -m "Permitir elegir otra cuenta al activar chapita"
          git push origin main
