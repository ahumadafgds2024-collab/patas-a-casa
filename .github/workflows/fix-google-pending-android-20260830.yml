name: Fix Google Pending Android 20260830

on:
  push:
    paths:
      - '.github/scripts/fix_google_pending_android_20260830.py'
      - '.github/workflows/fix-google-pending-android-20260830.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar corrección Android
        run: python .github/scripts/fix_google_pending_android_20260830.py
      - name: Verificar continuidad Google
        run: |
          grep -q 'emailMode?localStorage:sessionStorage' index.html
          grep -q 'localStorage.getItem(GOOGLE_PENDING_KEY)||sessionStorage.getItem(GOOGLE_PENDING_KEY)' mi-cuenta/index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html mi-cuenta/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mi-cuenta/index.html
          git commit -m 'Corregir continuidad de Google en Android'
          git push
