name: Fix PWA install flow iPhone Android

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pwa-install-ios-android-20260915.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply PWA install fixes
        run: python .github/scripts/fix_pwa_install_ios_android.py

      - name: Commit PWA fixes
        run: |
          git config user.name "patas-a-casa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mi-cuenta/index.html mi-cuenta/sw.js
          git commit -m "Dejar instalación PWA limpia en iPhone y Android"
          git push origin main
