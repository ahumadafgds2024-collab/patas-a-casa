name: Exigir contraseña tras Google 20260830

on:
  push:
    paths:
      - '.github/scripts/enforce_google_password_required_20260830.py'
      - '.github/workflows/enforce-google-password-required-20260830.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar requisito de contraseña
        run: python .github/scripts/enforce_google_password_required_20260830.py
      - name: Verificar flujo actual
        run: |
          grep -q 'function openClaim(){openPinClaim()}' mi-cuenta/index.html
          grep -q 'openPasswordSettings(true)' mi-cuenta/index.html
          grep -q 'function openPasswordSettings(required=false)' mi-cuenta/index.html
          grep -q 'securityPost({action:"password",password})' mi-cuenta/index.html
          ! grep -q 'passwordBackupLater' mi-cuenta/index.html
          ! grep -q 'patas-tag-scan' mi-cuenta/index.html
          ! grep -q 'patas-email-activation' mi-cuenta/index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- mi-cuenta/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-cuenta/index.html
          git commit -m 'Exigir contraseña de respaldo después de Google'
          git push
