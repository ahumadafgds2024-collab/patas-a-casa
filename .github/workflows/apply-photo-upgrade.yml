name: Apply Photo Upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-photo-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply photo upgrade
        run: python scripts/apply_photo_upgrade.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          html=open('index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          open('/tmp/app.js','w',encoding='utf-8').write('\n'.join(scripts))
          print('scripts:',len(scripts),'bytes:',sum(map(len,scripts)))
          PY
          node --check /tmp/app.js
      - name: Commit upgraded frontend
        run: |
          if git diff --quiet -- index.html; then
            echo 'No frontend changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Agregar fotos y perfil ampliado de mascotas'
          git push
