name: Restore shared activation existing form
on:
  push:
    paths:
      - '.github/workflows/restore-shared-activation-existing-form.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse existing Mi Cuenta flow after shared code
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mi-cuenta/shared-activate.html')
          s = p.read_text()
          old = "async function afterCode(){return (await validSession())?showConfirm():showLogin()}async function boot(){if(!tag){root.innerHTML='<section class=\"card\"><div class=\"note err\">No pudimos identificar esta chapita.</div></section>';return}const p=readPending();if(p?.activation_code){activationCode=String(p.activation_code);return afterCode()}showCode()}boot();"
          new = "async function afterCode(){savePending(activationCode);location.replace('/mi-cuenta/')}async function boot(){if(!tag){root.innerHTML='<section class=\"card\"><div class=\"note err\">No pudimos identificar esta chapita.</div></section>';return}const p=readPending();if(p?.activation_code){activationCode=String(p.activation_code);return afterCode()}showCode()}boot();"
          if old not in s:
              raise SystemExit('No se encontró el flujo esperado; no se modificó nada.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/restore-shared-activation-existing-form.yml
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-cuenta/shared-activate.html .github/workflows/restore-shared-activation-existing-form.yml
          git commit -m 'Restaurar formulario original para nueva chapita'
          git push
