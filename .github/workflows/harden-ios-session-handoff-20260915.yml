name: Harden iOS session handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-ios-session-handoff-20260915.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply iOS handoff hardening
        run: python .github/scripts/harden_ios_session_handoff_20260915.py

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('mi-cuenta/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          inline='\n'.join(s for s in scripts if s.strip())
          Path('/tmp/pac-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/pac-inline.js

      - name: Verify critical iPhone assets
        run: |
          test -s mi-cuenta/ios-guia/paso-1.jpg
          test -s mi-cuenta/ios-guia/paso-2.jpg
          test -s mi-cuenta/ios-guia/paso-3.jpg
          test -s mi-cuenta/ios-guia/paso-4.jpg
          grep -q 'pac-owner-v11' mi-cuenta/sw.js
          grep -q 'Ya la agregué y abre bien' mi-cuenta/index.html

      - name: Commit hardening
        run: |
          git config user.name "patas-a-casa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mi-cuenta/index.html mi-cuenta/sw.js
          git commit -m "Cubrir huecos de instalación y sesión en iPhone"
          git push origin main
