name: Require first install after first pet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/require-first-install-20260915.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make first install step mandatory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('mi-cuenta/index.html')
          s = index.read_text(encoding='utf-8')

          start = s.find('function showInstallFinish(installed=false){')
          end = s.find('function showAuth', start)
          if start < 0 or end < 0:
              raise SystemExit('No se encontró showInstallFinish')

          replacement = '''function showInstallFinish(installed=false){
           if(isStandalone()){setInstallPending(false);clearIosSessionBridge();loadDashboard();return}
           setInstallPending(false);
           if(isiOS())writeIosSessionBridge();
           const ios=isiOS();
           root.innerHTML=`<section class="card hero" id="installOnboarding"><div class="kicker">ÚLTIMO PASO</div><h1>${installed?"Patas a Casa ya está agregada ✅":"Agregá Patas a Casa al inicio."}</h1><p class="muted">Tu cuenta y los datos de tu mascota ya quedaron guardados. Para terminar la configuración, agregá Patas a Casa a la pantalla de inicio.</p></section>
           <section class="card">${installed?`<div class="status ok"><b>Instalación completada.</b><br>Podés abrir Patas a Casa desde su ícono.</div>`:ios?`<h2>Agregarla en iPhone</h2><p class="muted">Te mostramos exactamente dónde tocar en Safari. Son los mismos cuatro pasos con imágenes que ya tenías.</p><div class="note" style="margin-bottom:12px">Al elegir <b>Agregar a Inicio</b>, dejá activado <b>Abrir como app web</b> antes de tocar Agregar.</div><button class="btn primary wide" onclick="installApp()">📱 Ver los 4 pasos</button><p class="small muted" style="margin:12px 0 0;text-align:center">Después abrí Patas a Casa desde el ícono de la pantalla de inicio para continuar.</p>`:`<h2>Instalar en Android</h2><p class="muted small">Tocá el botón y confirmá la instalación de Patas a Casa. Si Chrome no muestra el cuadro automático, te indicamos la opción del menú.</p><button class="btn primary wide" onclick="installApp()">📲 Instalar Patas a Casa</button><p class="small muted" style="margin:12px 0 0;text-align:center">Para terminar la configuración, completá la instalación y abrí Patas a Casa desde su ícono.</p>`}</section>`;
          }
          '''

          s = s[:start] + replacement + s[end:]
          index.write_text(s, encoding='utf-8')

          sw = Path('mi-cuenta/sw.js')
          w = sw.read_text(encoding='utf-8')
          if 'const CACHE="pac-owner-v8";' in w:
              w = w.replace('const CACHE="pac-owner-v8";', 'const CACHE="pac-owner-v9";', 1)
          elif 'const CACHE="pac-owner-v9";' not in w:
              raise SystemExit('Versión de cache inesperada')
          sw.write_text(w, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "patas-a-casa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mi-cuenta/index.html mi-cuenta/sw.js
          git commit -m "Hacer obligatorio agregar al inicio tras la primera mascota"
          git push origin main
