name: Fix public profile scope

on:
  push:
    branches:
      - fix-public-profile-scope

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-public-profile-scope
          fetch-depth: 0

      - name: Apply isolated routing fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          account = Path('mi-cuenta/index.html')
          text = account.read_text(encoding='utf-8')
          old = 'href="/?tag=${encodeURIComponent(p.public_code)}"'
          new = 'href="/mi-cuenta/publico/?tag=${encodeURIComponent(p.public_code)}"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one public-profile link, found {count}')
          account.write_text(text.replace(old, new, 1), encoding='utf-8')

          config_path = Path('vercel.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          rewrites = config.setdefault('rewrites', [])
          rule = {'source': '/mi-cuenta/publico/:path*', 'destination': '/index.html'}
          if rule not in rewrites:
              rewrites.insert(0, rule)
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate only intended behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          html = Path('mi-cuenta/index.html').read_text(encoding='utf-8')
          assert 'href="/mi-cuenta/publico/?tag=${encodeURIComponent(p.public_code)}"' in html
          config = json.loads(Path('vercel.json').read_text(encoding='utf-8'))
          assert {'source': '/mi-cuenta/publico/:path*', 'destination': '/index.html'} in config.get('rewrites', [])
          PY
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('mi-cuenta/index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());
          for (const code of scripts) new Function(code);
          console.log(`Validated ${scripts.length} inline script block(s).`);
          NODE
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if ! git diff --quiet -- mi-cuenta/index.html vercel.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mi-cuenta/index.html vercel.json
            git commit -m "Mantener perfil público dentro de la app"
            git push origin HEAD:fix-public-profile-scope
          fi
