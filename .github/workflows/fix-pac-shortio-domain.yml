name: Fix Short.io default domain
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-pac-shortio-domain.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin Short.io domain
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('idealmente <b>patas.s.gy</b> o <b>pac.s.gy</b>', 'idealmente <b>pac.s.gy</b>')
          s=s.replace('value="patas.s.gy" placeholder="patas.s.gy"', 'value="pac.s.gy" placeholder="pac.s.gy"')
          old="try{const k=sessionStorage.getItem('pac_shortio_key'),d=sessionStorage.getItem('pac_shortio_domain');if(k)$('shortKey').value=k;if(d)$('shortDomain').value=d}catch{}"
          new="try{const k=sessionStorage.getItem('pac_shortio_key'),d=sessionStorage.getItem('pac_shortio_domain');if(k)$('shortKey').value=k;if(d&&d!=='patas.s.gy')$('shortDomain').value=d;else $('shortDomain').value='pac.s.gy'}catch{}"
          if old not in s:
              raise SystemExit('No encontré bloque de sessionStorage esperado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-pac-shortio-domain.yml
          git add admin.html
          git diff --cached --check
          git commit -m "Usar pac.s.gy como dominio Short.io por defecto"
          git push
