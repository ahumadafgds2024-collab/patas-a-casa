name: Apply Email Activation

on:
  push:
    paths:
      - '.github/workflows/apply-email-activation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply email activation frontend
        run: python .github/scripts/apply_email_activation.py
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          import re
          for path in ['index.html','mi-cuenta/index.html']:
              html=open(path,encoding='utf-8').read()
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
              out='/tmp/'+path.replace('/','_')+'.js'
              open(out,'w',encoding='utf-8').write('\n'.join(scripts))
              print(path, 'scripts:',len(scripts))
          PY
          node --check /tmp/index.html.js
          node --check /tmp/mi-cuenta_index.html.js
      - name: Verify email activation integration
        run: |
          grep -q 'patas-email-activation' index.html
          grep -q 'patas-email-activation' mi-cuenta/index.html
          grep -q 'Ya tengo cuenta' index.html
          grep -q 'activation_method' mi-cuenta/index.html
          grep -q 'prepareQueuedActivation' mi-cuenta/index.html
      - name: Commit email activation frontend
        run: |
          if git diff --quiet -- index.html mi-cuenta/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mi-cuenta/index.html
          git commit -m 'Agregar activación por email para lote nuevo'
          git push
