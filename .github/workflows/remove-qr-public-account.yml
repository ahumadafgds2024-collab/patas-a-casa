name: Limpiar encabezado Mi cuenta

on:
  push:
    paths:
      - '.github/workflows/remove-qr-public-account.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar acceso QR público del encabezado
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mi-cuenta/index.html')
          s=p.read_text(encoding='utf-8')
          old='<header><div class="brand"><div class="logo">🐾</div><div>Patas a Casa<div class="small muted">Mi cuenta</div></div></div><div class="header-actions"><a class="btn soft" href="/">QR público</a></div></header>'
          new='<header><div class="brand"><div class="logo">🐾</div><div>Patas a Casa<div class="small muted">Mi cuenta</div></div></div></header>'
          if old not in s:
              raise SystemExit('No encontré el encabezado esperado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert 'QR público' not in s
          assert '👁 Ver perfil público' in s
          PY
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('mi-cuenta/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/account.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/account.js
      - name: Publicar
        run: |
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-cuenta/index.html
          git commit -m 'Quitar QR público del encabezado de Mi cuenta'
          git push
