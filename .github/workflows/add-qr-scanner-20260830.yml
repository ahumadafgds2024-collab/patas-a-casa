name: Add QR Scanner 20260830

on:
  push:
    paths:
      - '.github/scripts/add_qr_scanner_20260830.py'
      - '.github/workflows/add-qr-scanner-20260830.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar lector QR
        run: python .github/scripts/add_qr_scanner_20260830.py
      - name: Verificar integración
        run: |
          grep -q 'patas-tag-scan' mi-cuenta/index.html
          grep -q 'function openQrScanner' mi-cuenta/index.html
          grep -q 'function openPinClaim' mi-cuenta/index.html
          grep -q 'Escanear QR' mi-cuenta/index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- mi-cuenta/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-cuenta/index.html
          git commit -m 'Agregar lector QR para sumar chapitas'
          git push
