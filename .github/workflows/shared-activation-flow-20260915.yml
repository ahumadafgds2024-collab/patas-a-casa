name: Activacion simple con codigo compartido

on:
  push:
    paths:
      - '.github/workflows/shared-activation-flow-20260915.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar cambios
        run: python .github/scripts/shared_activation_flow_20260915.py

      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re
          for src,out in [('tag.html','/tmp/tag.js'),('mi-cuenta/index.html','/tmp/account.js'),('mi-cuenta/confirmar/index.html','/tmp/confirm.js')]:
              html=open(src,encoding='utf-8').read()
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
              open(out,'w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/tag.js
          node --check /tmp/account.js
          node --check /tmp/confirm.js

      - name: Commit
        run: |
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tag.html mi-cuenta/index.html mi-cuenta/sw.js
          git commit -m 'Usar codigo compartido para chapitas nuevas'
          git push
