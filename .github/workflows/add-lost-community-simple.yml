name: Add lost pets community simple

on:
  push:
    branches:
      - feature/mascotas-perdidas-simple
    paths:
      - .github/workflows/add-lost-community-simple.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/mascotas-perdidas-simple

      - name: Apply safe patch
        run: python scripts/add_lost_community_simple.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mi-cuenta/index.html mi-cuenta/perdidas/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Agregar acceso y lista de mascotas perdidas"
          git push origin HEAD:feature/mascotas-perdidas-simple
