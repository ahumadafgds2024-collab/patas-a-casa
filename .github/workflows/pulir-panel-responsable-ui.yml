name: Pulir panel responsable UI

on:
  push:
    paths:
      - '.github/workflows/pulir-panel-responsable-ui.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar pulido reversible
        run: python scripts/pulir_panel_responsable_ui.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re
          html=open('mi-cuenta/index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          open('/tmp/patas-account.js','w',encoding='utf-8').write('\n'.join(scripts))
          print('scripts:',len(scripts),'bytes:',sum(map(len,scripts)))
          PY
          node --check /tmp/patas-account.js
      - name: Validar cambios esperados
        run: |
          grep -q 'pac-owner-polish-v1' mi-cuenta/index.html
          grep -q 'Más opciones' mi-cuenta/index.html
          grep -q 'Agregar chapita' mi-cuenta/index.html
          grep -q 'accountMenuBtn' mi-cuenta/index.html
      - name: Commit UI pulida
        run: |
          if git diff --quiet -- mi-cuenta/index.html; then
            echo 'No hay cambios para aplicar.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-cuenta/index.html
          git commit -m 'Pulir jerarquia visual del panel responsable'
          git push
