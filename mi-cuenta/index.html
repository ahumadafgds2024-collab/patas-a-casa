<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171719">
<meta name="description" content="Panel privado de Patas a Casa para administrar mascotas, chapitas, modo perdido, flyers y avistamientos.">
<link rel="icon" type="image/png" href="/mi-cuenta/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Patas a Casa">
<link rel="manifest" href="/mi-cuenta/manifest.webmanifest">
<link rel="apple-touch-icon" href="/mi-cuenta/icons/icon-192.png">
<title>Mi cuenta · Patas a Casa</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#171719;--muted:#737373;--line:#e7e6e1;--orange:#ff6a36;--orange2:#ff8c65;--red:#d83f50;--green:#177346;--shadow:0 18px 55px rgba(20,20,20,.08);--r:26px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#fff 0,#f7f7f4 38%,#f2f2ef 100%);min-height:100vh}
button,input,textarea,select{font:inherit}.app{max-width:760px;margin:auto;padding:16px 15px calc(80px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:-.03em}.logo{width:43px;height:43px;border-radius:15px;background:#171719;display:grid;place-items:center;color:#fff}.header-actions{display:flex;gap:8px;align-items:center}
.card{background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:var(--r);padding:21px;box-shadow:var(--shadow);margin-bottom:13px}.hero{padding:24px}.kicker{font-size:11px;letter-spacing:.08em;font-weight:950;color:#ce4d20}h1{font-size:37px;line-height:1;letter-spacing:-.055em;margin:10px 0 12px}h2{font-size:21px;letter-spacing:-.03em;margin:0 0 12px}h3{margin:0;font-size:18px}p{line-height:1.5}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}
.btn{appearance:none;border:0;border-radius:15px;padding:12px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:disabled{opacity:.55;cursor:wait}
button:focus-visible,a:focus-visible{outline:3px solid rgba(255,106,54,.38);outline-offset:3px}.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff}.dark{background:#171719;color:#fff}.soft{background:#efefec;color:#29292b}.green{background:#e9f7ef;color:#176f45;border:1px solid #ccebd7}.red{background:#fff0f2;color:#ad2d3b;border:1px solid #ffd0d6}.wide{width:100%}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:900;margin:0 0 7px;color:#47474c}.field input,.field textarea,.field select{width:100%;border:1px solid #deded9;background:#fff;border-radius:14px;padding:13px;color:var(--ink);outline:none}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#f2a081;box-shadow:0 0 0 3px rgba(255,106,54,.09)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#efefec;border-radius:15px;padding:4px;margin-bottom:18px}.tab{border:0;background:transparent;border-radius:12px;padding:10px;font-weight:900;color:#777;cursor:pointer}.tab.on{background:#fff;color:#171719;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.note{padding:13px 14px;border-radius:16px;background:#fafaf8;border:1px solid var(--line);font-size:12px;color:#68686d;line-height:1.45}.status{padding:12px 14px;border-radius:15px;font-size:13px;margin-top:11px}.status.ok{background:#ebf8f0;color:#176f45}.status.err{background:#fff0f1;color:#a92f3b}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.account-email{font-size:12px;color:var(--muted);margin-top:4px}.install{white-space:nowrap}
.pets{display:grid;gap:12px}.pet{border:1px solid var(--line);border-radius:21px;padding:15px;background:#fff}.pethead{display:flex;align-items:center;gap:13px}.avatar{width:82px;height:82px;flex:0 0 82px;border-radius:22px;background:linear-gradient(145deg,#fff1e9,#ffe1d2);display:grid;place-items:center;font-size:40px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.petname{font-size:25px;font-weight:950;letter-spacing:-.04em}.meta{font-size:12px;color:var(--muted);margin-top:5px}.pill{display:inline-flex;margin-top:7px;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:950;background:#edf8f2;color:#147145}.pill.lost{background:#fff0f2;color:#b02c3a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions .btn{flex:1;min-width:150px}
.sight{border-top:1px solid var(--line);padding:12px 0}.sight:first-child{border-top:0}.sighttime{font-size:11px;color:var(--muted);font-weight:800}.maplink{font-size:12px;font-weight:900;color:#176f45;text-decoration:none}.empty{text-align:center;padding:25px 10px;color:var(--muted)}
.modal{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:14px}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:27px;padding:20px;box-shadow:0 25px 80px rgba(0,0,0,.35)}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.x{border:0;background:#efefec;width:38px;height:38px;border-radius:50%;font-size:21px;cursor:pointer}
.photo-pick{display:flex;align-items:center;gap:13px;padding:12px;border:1px solid var(--line);border-radius:18px;background:#fafaf8;margin-bottom:14px}.photo-prev{width:76px;height:76px;border-radius:20px;background:#ffe7dc;display:grid;place-items:center;font-size:35px;overflow:hidden}.photo-prev img{width:100%;height:100%;object-fit:cover}.photo-info{flex:1}.file-btn{display:inline-flex;margin-top:7px;padding:9px 11px;border-radius:12px;background:#fff;border:1px solid #ddd;font-size:11px;font-weight:900;cursor:pointer}.file-btn input{display:none}.check{display:flex;gap:8px;align-items:flex-start;font-size:12px;margin:10px 0}.check input{margin-top:2px}
.install-steps{display:grid;gap:10px}.step{background:#fafaf8;border:1px solid var(--line);border-radius:16px;padding:12px;font-size:13px;line-height:1.45}
.loading{text-align:center;padding:35px;color:var(--muted)}.toast{position:fixed;z-index:80;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#171719;color:#fff;padding:12px 15px;border-radius:15px;box-shadow:0 14px 40px rgba(0,0,0,.22);font-size:13px;max-width:90%}
@media(max-width:560px){h1{font-size:33px}.split{grid-template-columns:1fr}.topline{flex-direction:column}.install{width:100%}.actions{display:grid;grid-template-columns:1fr}.actions .btn{min-width:0}.avatar{width:72px;height:72px;flex-basis:72px}.petname{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">🐾</div><div>Patas a Casa<div class="small muted">Mi cuenta</div></div></div></header>
<main id="root"><section class="card loading">Cargando tu cuenta…</section></main>
</div>
<div id="modal" class="modal hidden"></div>
<script>
const SUPABASE_URL="https://cgciwutqwnssdphugupq.supabase.co";
const PUBLISHABLE_KEY="sb_publishable_oozsLV8QMoy_ooLIqgh_qg_vvjV6IY5";
const ACCOUNT_API=SUPABASE_URL+"/functions/v1/patas-account";
const REGISTER_API=SUPABASE_URL+"/functions/v1/patas-register-v2";
const LOST_API=SUPABASE_URL+"/functions/v1/patas-lost";
const AUTH=SUPABASE_URL+"/auth/v1";
const SESSION_KEY="pac_owner_session_v1";
const root=document.getElementById("root"),modal=document.getElementById("modal");
let pets=[],deferredInstall=null,currentUser=null,flyerBlob=null,flyerObjectUrl=null,flyerFileName="";

const esc=(v="")=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function setSession(s){if(!s){localStorage.removeItem(SESSION_KEY);return}if(!s.expires_at&&s.expires_in)s.expires_at=Math.floor(Date.now()/1000)+Number(s.expires_in);localStorage.setItem(SESSION_KEY,JSON.stringify(s))}
function getSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{return null}}
async function authPost(path,body,token=""){const h={"Content-Type":"application/json","apikey":PUBLISHABLE_KEY};if(token)h.Authorization="Bearer "+token;const r=await fetch(AUTH+path,{method:"POST",headers:h,body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.message||j.error_description||"No pudimos iniciar sesión.");return j}
async function login(email,password){const s=await authPost("/token?grant_type=password",{email,password});setSession(s);return s}
async function refreshSession(){let s=getSession();if(!s?.refresh_token)return null;try{const n=await authPost("/token?grant_type=refresh_token",{refresh_token:s.refresh_token});setSession(n);return n}catch{setSession(null);return null}}
async function validSession(){let s=getSession();if(!s)return null;const now=Math.floor(Date.now()/1000);if(!s.expires_at||s.expires_at-now<90)s=await refreshSession();return s}
async function accountPost(data,requiresAuth=true){let s=requiresAuth?await validSession():null;const h={"Content-Type":"application/json","apikey":PUBLISHABLE_KEY};if(s?.access_token)h.Authorization="Bearer "+s.access_token;const r=await fetch(ACCOUNT_API,{method:"POST",headers:h,body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(r.status===401&&requiresAuth){setSession(null);showAuth("Tu sesión venció. Volvé a ingresar.");throw new Error("Sesión vencida.")}if(!r.ok)throw new Error(j.error||"Ocurrió un error.");return j}
async function registerPost(data,requiresAuth=false){let s=requiresAuth?await validSession():null;const h={"Content-Type":"application/json","apikey":PUBLISHABLE_KEY};if(s?.access_token)h.Authorization="Bearer "+s.access_token;const r=await fetch(REGISTER_API,{method:"POST",headers:h,body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(r.status===401&&requiresAuth){setSession(null);showAuth("Tu sesión venció. Volvé a ingresar.");throw new Error("Sesión vencida.")}if(!r.ok)throw new Error(j.error||"Ocurrió un error.");return j}
async function logout(){const s=getSession();try{if(s?.access_token)await authPost("/logout",{},s.access_token)}catch{}setSession(null);pets=[];currentUser=null;showAuth()}
function openModal(content){modal.innerHTML=`<div class="sheet">${content}</div>`;modal.classList.remove("hidden");modal.addEventListener("click",e=>{if(e.target===modal)closeModal()},{once:true})}
function closeModal(){if(flyerObjectUrl){URL.revokeObjectURL(flyerObjectUrl);flyerObjectUrl=null}flyerBlob=null;flyerFileName="";modal.classList.add("hidden");modal.innerHTML=""}
function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true}
function isiOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById("installBtn");if(b&&!isStandalone())b.classList.remove("hidden")});
window.addEventListener("appinstalled",()=>{deferredInstall=null;document.getElementById("installBtn")?.classList.add("hidden");toast("Patas a Casa quedó instalada ✅")});
async function installApp(){
 if(isStandalone()){toast("Ya está instalada en este dispositivo.");return}
 if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;return}
 if(isiOS()){openModal(`<div class="sheethead"><h2>Agregar al inicio</h2><button class="x" onclick="closeModal()">×</button></div><div class="install-steps"><div class="step"><b>1.</b> Abrí esta página en Safari.</div><div class="step"><b>2.</b> Tocá <b>Compartir</b> (el cuadrado con flecha hacia arriba).</div><div class="step"><b>3.</b> Elegí <b>Agregar a Inicio</b> y confirmá.</div></div><p class="small muted">Después vas a abrir Patas a Casa desde el ícono como una app.</p>`);return}
 openModal(`<div class="sheethead"><h2>Instalar Patas a Casa</h2><button class="x" onclick="closeModal()">×</button></div><p>Tu navegador todavía no mostró el cuadro automático.</p><div class="step">En Chrome/Edge abrí el menú <b>⋮</b> y elegí <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.</div>`);
}
function showAuth(message=""){
 const pre=new URLSearchParams(location.search).get("vincular")||"";
 root.innerHTML=`<section class="card hero"><div class="kicker">PANEL DEL RESPONSABLE</div><h1>Tus mascotas, siempre a mano.</h1><p class="muted">Entrá desde acá sin escanear la chapita. Después podés agregar Patas a Casa a la pantalla de inicio.</p></section>
 <section class="card"><div class="tabs"><button class="tab on" id="loginTab">Ingresar</button><button class="tab" id="signupTab">Crear cuenta</button></div>
 ${message?`<div class="status err">${esc(message)}</div>`:""}
 <form id="loginForm">
  <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>
  <div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" minlength="8" required></div>
  <button class="btn primary wide" type="submit">Entrar a mi cuenta</button>
  <a href="/mi-cuenta/recuperar/" style="display:block;text-align:center;margin-top:12px;color:#555;font-size:13px;font-weight:800;text-decoration:none">¿Olvidaste tu contraseña?</a>
 </form>
 <form id="signupForm" class="hidden">
  <div class="note" style="margin-bottom:14px">Para crear tu cuenta necesitás una <b>chapita ya activada</b> y su PIN privado. Después te vamos a enviar un correo para verificar que el email realmente sea tuyo.</div>
  <div class="split"><div class="field"><label>Código de chapita</label><input name="code" value="${esc(pre)}" maxlength="12" placeholder="7B958A9D" required></div><div class="field"><label>PIN privado</label><input name="pin" maxlength="50" placeholder="0000-0000" required></div></div>
  <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>
  <div class="field"><label>Elegí una contraseña</label><input name="password" type="password" autocomplete="new-password" minlength="8" required></div>
  <button class="btn primary wide" type="submit">Crear cuenta y verificar email</button>
 </form></section>`;
 const loginTab=document.getElementById("loginTab"),signupTab=document.getElementById("signupTab"),lf=document.getElementById("loginForm"),sf=document.getElementById("signupForm");
 function tab(which){const sign=which==="signup";loginTab.classList.toggle("on",!sign);signupTab.classList.toggle("on",sign);lf.classList.toggle("hidden",sign);sf.classList.toggle("hidden",!sign)}
 loginTab.onclick=()=>tab("login");signupTab.onclick=()=>tab("signup");if(pre)tab("signup");
 lf.addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter,bak=b.textContent,f=new FormData(e.currentTarget);b.disabled=true;b.textContent="Ingresando…";try{await login(f.get("email"),f.get("password"));let fin=null;try{fin=await registerPost({action:"finalize_registration"},true)}catch(err){console.warn("finalize_registration",err)}history.replaceState({},document.title,"/mi-cuenta/");await loadDashboard();if(fin?.linked&&!fin?.already)toast("Correo verificado. Tu mascota ya está vinculada ✅")}catch(err){const m=/email not confirmed/i.test(String(err?.message||""))?"Primero confirmá tu correo desde el enlace que te enviamos.":err.message;toast(m)}finally{b.disabled=false;b.textContent=bak}});
 sf.addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget,b=e.submitter,bak=b.textContent,f=new FormData(form),mail=String(f.get("email")).trim().toLowerCase(),pass=String(f.get("password"));b.disabled=true;b.textContent="Enviando verificación…";try{await registerPost({action:"start_registration",public_code:f.get("code"),activation_code:f.get("pin"),email:mail,password:pass},false);form.innerHTML=`<div class="status ok"><b>Revisá tu correo ✅</b><br>Te enviamos un enlace de verificación a ${esc(mail)}.</div><p class="muted small">Abrí el correo y tocá el enlace. Después volvé a Mi cuenta e ingresá con tu email y contraseña. La mascota se vincula recién después de verificar el correo.</p><button class="btn dark wide" type="button" id="goLogin">Ir a ingresar</button>`;document.getElementById("goLogin").onclick=()=>tab("login")}catch(err){toast(err.message)}finally{if(document.body.contains(b)){b.disabled=false;b.textContent=bak}}});
}
function petCard(p){
 const lost=p.status==="perdido";return `<article class="pet" data-code="${esc(p.public_code)}"><div class="pethead"><div class="avatar">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="Foto de ${esc(p.name)}">`:p.species==="Gato"?"🐱":"🐶"}</div><div><div class="petname">${esc(p.name)}</div><div class="meta">${esc([p.breed,p.sex,p.age_text].filter(Boolean).join(" · ")||p.species)}</div><span class="pill ${lost?"lost":""}">${lost?"🚨 PERDIDO":"● EN CASA"}</span><div class="small muted" style="margin-top:6px">Chapita ${esc(p.public_code)}</div></div></div>
 <div class="actions"><button class="btn ${lost?"green":"red"}" onclick="toggleLost('${esc(p.public_code)}','${lost?"normal":"perdido"}')">${lost?"✅ Ya volvió a casa":"🚨 Marcar como perdido"}</button><button class="btn primary" onclick="openFlyer('${esc(p.public_code)}')">🖼 Generar flyer</button><button class="btn soft" onclick="editPet('${esc(p.public_code)}')">✏️ Editar perfil</button><button class="btn soft" onclick="showSightings('${esc(p.public_code)}')">📍 Avistamientos</button><a class="btn dark" href="/?tag=${encodeURIComponent(p.public_code)}" target="_blank" rel="noopener">👁 Ver perfil público</a></div></article>`;
}
async function loadDashboard(){
 root.innerHTML='<section class="card loading">Cargando tus mascotas…</section>';
 try{const d=await accountPost({action:"list_my_pets"});pets=d.pets||[];currentUser=d.user;renderDashboard()}catch(err){if(getSession())root.innerHTML=`<section class="card"><h2>No pudimos cargar tu cuenta</h2><p class="muted">${esc(err.message)}</p><button class="btn soft" onclick="loadDashboard()">Reintentar</button></section>`}
}
function renderDashboard(){
 root.innerHTML=`<section class="card"><div class="topline"><div><div class="kicker">MI CUENTA</div><h1 style="font-size:31px;margin-bottom:6px">Tus mascotas.</h1><div class="account-email">${esc(currentUser?.email||"")}</div></div><button id="installBtn" class="btn primary install ${isStandalone()?"hidden":""}" onclick="installApp()">📲 Añadir al inicio</button></div><div class="actions" style="margin-top:14px"><button class="btn soft" onclick="openClaim()">＋ Agregar otra chapita</button><button class="btn soft" onclick="logout()">Cerrar sesión</button></div></section>
 <section class="card"><h2>Mis mascotas</h2><div class="pets">${pets.length?pets.map(petCard).join(""):`<div class="empty">Todavía no hay mascotas vinculadas.<br><button class="btn primary" style="margin-top:12px" onclick="openClaim()">Agregar mi chapita</button></div>`}</div></section>
 <section class="card"><h2>Acceso rápido</h2><p class="muted small">Instalá este panel en tu celular para abrirlo desde un ícono, sin escanear ninguna chapita.</p><button class="btn dark wide ${isStandalone()?"hidden":""}" onclick="installApp()">📲 Añadir Patas a Casa a mi pantalla de inicio</button></section>`;
}
function openClaim(){
 openModal(`<div class="sheethead"><div><div class="kicker">NUEVA MASCOTA</div><h2>Agregar una chapita</h2></div><button class="x" onclick="closeModal()">×</button></div><p class="muted small">La chapita tiene que estar activada. Vas a usar su PIN una sola vez para demostrar que es tuya.</p><form id="claimForm"><div class="split"><div class="field"><label>Código</label><input name="code" maxlength="12" required></div><div class="field"><label>PIN privado</label><input name="pin" maxlength="50" required></div></div><button class="btn primary wide" type="submit">Agregar a mi cuenta</button></form>`);
 document.getElementById("claimForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter,bak=b.textContent,f=new FormData(e.currentTarget);b.disabled=true;b.textContent="Vinculando…";try{await accountPost({action:"claim_pet",public_code:f.get("code"),activation_code:f.get("pin")});closeModal();await loadDashboard();toast("Mascota agregada ✅")}catch(err){toast(err.message)}finally{b.disabled=false;b.textContent=bak}});
}
async function lostPost(data){
 let s=await validSession();if(!s)throw new Error("Sesión vencida.");
 const h={"Content-Type":"application/json","apikey":PUBLISHABLE_KEY,"Authorization":"Bearer "+s.access_token};
 const r=await fetch(LOST_API,{method:"POST",headers:h,body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));
 if(r.status===401){setSession(null);showAuth("Tu sesión venció. Volvé a ingresar.");throw new Error("Sesión vencida.")}
 if(!r.ok)throw new Error(j.error||"No pudimos cambiar el estado.");return j
}
function localDateTimeValue(d=new Date()){
 const pad=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`
}
async function toggleLost(c,status){
 const p=pets.find(x=>x.public_code===c);if(!p)return;
 if(status==="normal"){
   if(!confirm(`¿${p.name} ya volvió a casa? Se quitará la alerta pública.`))return;
   try{await lostPost({public_code:c,status:"normal"});await loadDashboard();toast("Marcado nuevamente en casa ✅")}catch(err){toast(err.message)}
   return
 }
 openModal(`<div class="sheethead"><div><div class="kicker">MARCAR COMO PERDIDO</div><h2>${esc(p.name)}</h2></div><button class="x" onclick="closeModal()">×</button></div>
 <p class="muted small">Estos datos aparecerán en el perfil público para que quien encuentre a ${esc(p.name)} sepa dónde y cuándo se perdió.</p>
 <form id="lostForm">
   <div class="field"><label>¿Dónde fue visto por última vez?</label><input name="lost_location" maxlength="160" placeholder="Ej. Parque General San Martín, cerca de los Portones" required></div>
   <div class="field"><label>Fecha y hora aproximada</label><input name="lost_at" type="datetime-local" value="${localDateTimeValue()}" required></div>
   <div class="field"><label>Detalles (opcional)</label><textarea name="lost_details" maxlength="700" placeholder="Ej. Se escapó con collar azul. Es amistoso pero puede estar asustado."></textarea></div>
   <button class="btn red wide" type="submit">🚨 Activar alerta de perdido</button>
 </form>`);
 document.getElementById("lostForm").addEventListener("submit",async e=>{
   e.preventDefault();const b=e.submitter,bak=b.textContent,f=new FormData(e.currentTarget),raw=String(f.get("lost_at")||""),when=new Date(raw);
   if(Number.isNaN(when.getTime())){toast("Ingresá una fecha y hora válidas.");return}
   b.disabled=true;b.textContent="Activando alerta…";
   try{await lostPost({public_code:c,status:"perdido",lost_location:f.get("lost_location"),lost_at:when.toISOString(),lost_details:f.get("lost_details")});closeModal();await loadDashboard();toast("Alerta de perdido activada 🚨")}
   catch(err){toast(err.message)}finally{b.disabled=false;b.textContent=bak}
 });
}
async function showSightings(c){
 const p=pets.find(x=>x.public_code===c);openModal(`<div class="sheethead"><div><div class="kicker">AVISTAMIENTOS</div><h2>${esc(p?.name||"Mascota")}</h2></div><button class="x" onclick="closeModal()">×</button></div><div class="loading" id="sights">Cargando…</div>`);
 try{const d=await accountPost({action:"list_sightings",public_code:c});const box=document.getElementById("sights"),ss=d.sightings||[];box.className="";box.innerHTML=ss.length?ss.map(s=>{const dt=new Date(s.created_at).toLocaleString("es-AR");const map=s.location_consent&&s.latitude!=null&&s.longitude!=null?`<a class="maplink" target="_blank" href="https://maps.google.com/?q=${encodeURIComponent(s.latitude+","+s.longitude)}">📍 Ver ubicación</a>`:"";return `<div class="sight"><div class="sighttime">${esc(dt)}</div><b>${esc(s.area_text||"Sin zona informada")}</b>${s.message?`<div class="small" style="margin-top:5px">${esc(s.message)}</div>`:""}${s.finder_phone?`<div class="small muted">Contacto: ${esc(s.finder_phone)}</div>`:""}<div style="margin-top:6px">${map}</div></div>`}).join(""):`<div class="empty">Todavía no hay avistamientos registrados.</div>`}catch(err){document.getElementById("sights").innerHTML=`<div class="status err">${esc(err.message)}</div>`}

function fitFlyerText(ctx,text,maxWidth,startSize,minSize=34){
 let size=startSize;ctx.font=`900 ${size}px Arial, sans-serif`;while(size>minSize&&ctx.measureText(text).width>maxWidth){size-=2;ctx.font=`900 ${size}px Arial, sans-serif`}return size
}
function roundedFlyerRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function loadFlyerPhoto(src){
 const r=await fetch(src,{mode:"cors",cache:"no-store"});if(!r.ok)throw new Error("No pudimos cargar la foto de la mascota.");const blob=await r.blob(),url=URL.createObjectURL(blob);
 try{return await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("No pudimos preparar la foto para el flyer."));img.src=url})}finally{setTimeout(()=>URL.revokeObjectURL(url),0)}
}
function drawCover(ctx,img,x,y,w,h){const ir=img.naturalWidth/img.naturalHeight,br=w/h;let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;if(ir>br){sw=img.naturalHeight*br;sx=(img.naturalWidth-sw)/2}else{sh=img.naturalWidth/br;sy=(img.naturalHeight-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}
async function buildFlyer(p){
 const phone=String(p.contact_whatsapp||p.contact_phone||"").trim();if(!p.photo_url)throw new Error("Primero cargá una foto de la mascota para generar el flyer.");if(!phone)throw new Error("Primero cargá un teléfono o WhatsApp de contacto.");
 const img=await loadFlyerPhoto(p.photo_url),canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");canvas.width=1080;canvas.height=1920;
 ctx.fillStyle="#f4f4f1";ctx.fillRect(0,0,1080,1920);
 ctx.fillStyle="#d83f50";ctx.fillRect(0,0,1080,270);
 ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="900 104px Arial, sans-serif";ctx.fillText("SE PERDIÓ",540,135);
 const petName=String(p.name||"MASCOTA").toUpperCase();ctx.fillStyle="#171719";const nameSize=fitFlyerText(ctx,petName,920,92,54);ctx.font=`900 ${nameSize}px Arial, sans-serif`;ctx.fillText(petName,540,360);
 const photoX=70,photoY=445,photoW=940,photoH=950;ctx.save();roundedFlyerRect(ctx,photoX,photoY,photoW,photoH,46);ctx.clip();drawCover(ctx,img,photoX,photoY,photoW,photoH);ctx.restore();
 const details=[p.breed,p.color].filter(Boolean).map(v=>String(v).trim()).filter(Boolean).join(" · ");if(details){ctx.fillStyle="#66666b";ctx.font="700 34px Arial, sans-serif";fitFlyerText(ctx,details,900,34,26);ctx.fillText(details,540,1450)}
 ctx.fillStyle="#fff";roundedFlyerRect(ctx,70,1515,940,300,42);ctx.fill();ctx.fillStyle="#171719";ctx.font="900 42px Arial, sans-serif";ctx.fillText("SI LA VES, POR FAVOR COMUNICATE",540,1590);
 const phoneSize=fitFlyerText(ctx,phone,850,76,44);ctx.font=`900 ${phoneSize}px Arial, sans-serif`;ctx.fillStyle="#d83f50";ctx.fillText(phone,540,1690);ctx.fillStyle="#737373";ctx.font="700 30px Arial, sans-serif";ctx.fillText("WhatsApp / llamada",540,1760);
 ctx.fillStyle="#171719";ctx.font="900 30px Arial, sans-serif";ctx.fillText("Patas a Casa",540,1870);
 return canvas
}
async function openFlyer(c){
 const p=pets.find(x=>x.public_code===c);if(!p)return;openModal(`<div class="sheethead"><div><div class="kicker">FLYER</div><h2>${esc(p.name)}</h2></div><button class="x" onclick="closeModal()">×</button></div><div class="loading" id="flyerLoading">Generando flyer 1080 × 1920…</div>`);
 try{const canvas=await buildFlyer(p),blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("No pudimos crear la imagen.")),"image/png"));if(flyerObjectUrl)URL.revokeObjectURL(flyerObjectUrl);flyerBlob=blob;flyerObjectUrl=URL.createObjectURL(blob);flyerFileName=`${String(p.name||"mascota").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"mascota"}-se-perdio.png`;const box=document.querySelector("#modal .sheet");box.innerHTML=`<div class="sheethead"><div><div class="kicker">LISTO PARA COMPARTIR</div><h2>Flyer de ${esc(p.name)}</h2></div><button class="x" onclick="closeModal()">×</button></div><p class="small muted">Formato vertical 1080 × 1920 para historias de Instagram y estados de WhatsApp. Sin QR.</p><div style="background:#efefec;border-radius:20px;padding:10px;text-align:center"><img src="${flyerObjectUrl}" alt="Flyer de ${esc(p.name)}" style="display:block;width:min(100%,330px);height:auto;margin:auto;border-radius:15px;box-shadow:0 12px 35px rgba(0,0,0,.15)"></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="shareFlyer()">↗️ Compartir</button><button class="btn dark" onclick="downloadFlyer()">⬇️ Guardar imagen</button></div>`}catch(err){const box=document.querySelector("#modal .sheet");if(box)box.innerHTML=`<div class="sheethead"><h2>No pudimos generar el flyer</h2><button class="x" onclick="closeModal()">×</button></div><div class="status err">${esc(err.message)}</div><p class="small muted">Podés corregir el dato desde “Editar perfil” y volver a intentarlo.</p>`}
}
async function shareFlyer(){
 if(!flyerBlob)return;const file=new File([flyerBlob],flyerFileName||"flyer-patas-a-casa.png",{type:"image/png"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"Mascota perdida",text:"Por favor ayudame a difundir."});return}catch(err){if(err?.name==="AbortError")return}}
 downloadFlyer();toast("Tu celular no permite compartir la imagen directamente. La guardamos para que la envíes por WhatsApp o Instagram.")
}
function downloadFlyer(){if(!flyerBlob)return;const a=document.createElement("a"),url=URL.createObjectURL(flyerBlob);a.href=url;a.download=flyerFileName||"flyer-patas-a-casa.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function compressPhoto(file){return new Promise((resolve,reject)=>{if(!file){resolve(null);return}if(!file.type.startsWith("image/")){reject(new Error("Elegí una imagen válida."));return}if(file.size>12*1024*1024){reject(new Error("La foto es demasiado grande."));return}const reader=new FileReader();reader.onerror=()=>reject(new Error("No pudimos leer la foto."));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("No pudimos procesar la foto."));img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height)),w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale)),canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL("image/jpeg",.82))};img.src=String(reader.result)};reader.readAsDataURL(file)})}
function editPet(c){
 const p=pets.find(x=>x.public_code===c);if(!p)return;openModal(`<div class="sheethead"><div><div class="kicker">EDITAR</div><h2>${esc(p.name)}</h2></div><button class="x" onclick="closeModal()">×</button></div><form id="editForm">
 <div class="photo-pick"><div class="photo-prev" id="prev">${p.photo_url?`<img src="${esc(p.photo_url)}">`:(p.species==="Gato"?"🐱":"🐶")}</div><div class="photo-info"><b>Foto</b><div class="small muted">Se comprime antes de subir.</div><label class="file-btn">📷 Cambiar foto<input id="photo" type="file" accept="image/*"></label>${p.photo_url?`<label class="check"><input id="removePhoto" type="checkbox"> Quitar foto actual</label>`:""}</div></div>
 <div class="split"><div class="field"><label>Nombre</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>Especie</label><select name="species"><option ${p.species==="Perro"?"selected":""}>Perro</option><option ${p.species==="Gato"?"selected":""}>Gato</option><option ${p.species==="Otra"?"selected":""}>Otra</option></select></div></div>
 <div class="split"><div class="field"><label>Raza</label><input name="breed" value="${esc(p.breed||"")}"></div><div class="field"><label>Edad</label><input name="age_text" value="${esc(p.age_text||"")}"></div></div>
 <div class="split"><div class="field"><label>Sexo</label><select name="sex"><option value="">Sin informar</option><option ${p.sex==="Macho"?"selected":""}>Macho</option><option ${p.sex==="Hembra"?"selected":""}>Hembra</option></select></div><div class="field"><label>Tamaño</label><select name="size"><option value="">Sin informar</option><option ${p.size==="Pequeño"?"selected":""}>Pequeño</option><option ${p.size==="Mediano"?"selected":""}>Mediano</option><option ${p.size==="Grande"?"selected":""}>Grande</option></select></div></div>
 <div class="field"><label>Color / señas</label><input name="color" value="${esc(p.color||"")}"></div>

 <div class="field"><label>Segundo contacto de emergencia</label><input name="alt_contact" value="${esc(p.alt_contact||"")}" placeholder="Nombre y teléfono"></div>
 <details><summary style="font-weight:900;margin-bottom:12px">Salud y cuidados</summary><div class="field"><label>Enfermedades</label><textarea name="diseases">${esc(p.diseases||"")}</textarea></div><div class="field"><label>Medicaciones</label><textarea name="medications">${esc(p.medications||"")}</textarea></div><div class="field"><label>Horario de medicación</label><textarea name="medication_schedule">${esc(p.medication_schedule||"")}</textarea></div><div class="field"><label>Alergias</label><textarea name="allergies">${esc(p.allergies||"")}</textarea></div><div class="field"><label>Cuidados especiales</label><textarea name="special_care">${esc(p.special_care||"")}</textarea></div><div class="field"><label>Veterinario / dato útil</label><textarea name="vet_info">${esc(p.vet_info||"")}</textarea></div></details>
 <label class="check"><input name="public_health" type="checkbox" ${p.public_health?"checked":""}> Mostrar salud importante en el perfil público</label><label class="check"><input name="public_contact" type="checkbox" ${p.public_contact?"checked":""}> Mostrar opciones de contacto</label>
 <button class="btn primary wide" type="submit">Guardar cambios</button></form>`);
 const input=document.getElementById("photo"),prev=document.getElementById("prev");input.onchange=()=>{const f=input.files?.[0];if(!f)return;const u=URL.createObjectURL(f);prev.innerHTML=`<img src="${u}">`};
 document.getElementById("editForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter,bak=b.textContent,f=new FormData(e.currentTarget),o=Object.fromEntries(f.entries());o.action="update_pet";o.public_code=c;o.contact_phone=o.contact_whatsapp;o.public_health=f.get("public_health")==="on";o.public_contact=f.get("public_contact")==="on";o.remove_photo=document.getElementById("removePhoto")?.checked||false;b.disabled=true;b.textContent="Guardando…";try{const photo=input.files?.[0];if(photo){b.textContent="Preparando foto…";o.photo_data=await compressPhoto(photo)}await accountPost(o);closeModal();await loadDashboard();toast("Perfil actualizado ✅")}catch(err){toast(err.message)}finally{b.disabled=false;b.textContent=bak}});
}
