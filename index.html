<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<title>Patas a Casa</title>
<link rel="icon" type="image/png" href="/mi-cuenta/icons/icon-192.png">
<style>html,body{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden;background:#fff8f1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#17324d;font-weight:800}.loading div{text-align:center}.paw{font-size:34px;margin-bottom:10px}</style>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const tag=params.get('tag');
  if(tag){
    location.replace('/tag.html?tag='+encodeURIComponent(tag));
    return;
  }
  fetch('/landing.html',{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('landing');return r.text()})
    .then(html=>{
      const mobileFix=`<style id="pac-landing-mobile-fix">
html,body{width:100%;max-width:100%;overflow-x:hidden!important}
body{position:relative}
main,.hero,.section,.cta,footer{max-width:100%;overflow-x:hidden}
@media(max-width:680px){
  .wrap{width:calc(100% - 28px)!important;max-width:100%!important}
  .nav{gap:10px!important}
  .brand{min-width:0;max-width:calc(100% - 58px)}
  .brand span{overflow:hidden;text-overflow:ellipsis}
  .nav-actions>a.btn{display:none!important}
  .mobile-menu a:last-child{background:#17324d;color:#fff;margin-top:4px;text-align:center}

  .hero{padding:104px 0 52px!important}

  .hero-grid{width:100%;max-width:100%;overflow:hidden}

  .hero-copy{font-size:16px!important;line-height:1.58!important}

  .hero-visual{width:100%!important;max-width:100%!important;min-height:430px!important;margin:28px auto 0!important;transform:none!important;overflow:hidden!important;border-radius:30px;perspective:none!important}

  .section{padding:68px 0!important}

  .lead{font-size:15px!important;line-height:1.58!important}
  .story-card,.story-card.big,.step-card,.feature-card{border-radius:23px!important}
  .story-card,.story-card.big{padding:23px!important}

  .steps,.features{grid-template-columns:1fr!important}
  .found-grid,.story-grid,.lost-grid,.activate-box,.cta-box{grid-template-columns:1fr!important;gap:34px!important}
  .found-phone{width:min(100%,310px)!important;max-width:100%!important;transform:none!important;border-radius:34px!important;padding:8px!important}

  .footer-inner{display:grid!important;gap:18px!important}

  .wrap{width:calc(100% - 22px)!important}
  h1{font-size:39px!important}
  .hero-visual{min-height:400px!important}
  .phone{width:205px!important;height:405px!important;right:1%!important}
  .tag-mock{width:142px!important;height:163px!important;left:0!important}
  .qr-side{width:76px!important;height:76px!important;left:66px!important;bottom:82px!important}
  .float-card{font-size:8px!important}
  .found-phone{width:100%!important}
  .section h2{font-size:34px!important}
  .cta-box h2{font-size:34px!important}
}
</style>`;
      const visualFix=`<style id="pac-brand-product-fix">

.brand .pac-wordmark b{color:#f47b35;font-weight:950}
.tag-mock.pac-real-tag{background:transparent!important;box-shadow:none!important;border-radius:0!important;display:block!important;width:245px;height:282px;padding:0!important;color:inherit!important}
.tag-mock.pac-real-tag svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 25px 30px rgba(23,50,77,.25))}

</style>`;
      const oldBrand='<a class="brand" href="#inicio"><img src="/mi-cuenta/icons/icon-192.png" alt="Logo de Patas a Casa"><span>Patas a Casa</span></a>';
      const newBrand='<a class="brand" href="#inicio" aria-label="Patas a Casa"><svg class="pac-official-logo" viewBox="0 0 120 100" role="img" aria-label="Logo de Patas a Casa" xmlns="http://www.w3.org/2000/svg"><path d="M14 46 60 10l46 36v40H14Z" fill="none" stroke="#17324d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 76c0-13 4-24 13-29 4-2 9-2 12 1 2 2 4 5 4 9v21H50c-5 0-9-1-13-2Z" fill="#17324d"/><circle cx="51" cy="43" r="8" fill="#17324d"/><path d="m45 37 2-9 8 7Z" fill="#17324d"/><path d="M74 78V54l-8-9 10 3 6-7 3 10c6 4 9 11 9 21v6Z" fill="#f47b35"/><path d="M59 31c-4-7-14-4-14 4 0 8 14 15 14 15s14-7 14-15c0-8-10-11-14-4Z" fill="#f47b35"/></svg><span class="pac-wordmark">Patas <b>a</b> Casa</span></a>';
      const oldTag='<div class="tag-mock"><div class="tag-hole"></div><div class="paws">🐾</div><div class="tag-label">Patas a Casa</div><div class="tag-small">Frente de la chapita</div></div>';
      const newTag='<div class="tag-mock pac-real-tag" aria-label="Chapita Patas a Casa"><svg viewBox="0 0 420 480" role="img" aria-label="Chapita azul Patas a Casa con huella blanca" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="pacTagBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18b9e8"/><stop offset=".55" stop-color="#08a7dc"/><stop offset="1" stop-color="#078cc4"/></linearGradient><linearGradient id="pacEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57d8f5"/><stop offset="1" stop-color="#0579ae"/></linearGradient><linearGradient id="pacMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dce7ed"/><stop offset=".35" stop-color="#6c8390"/><stop offset=".65" stop-color="#f5fafc"/><stop offset="1" stop-color="#6b7f8a"/></linearGradient></defs><ellipse cx="210" cy="45" rx="35" ry="51" fill="none" stroke="url(#pacMetal)" stroke-width="13" transform="rotate(14 210 45)"/><path d="M181 100c0-22 13-39 29-39s29 17 29 39v22h-58Z" fill="url(#pacEdge)"/><circle cx="210" cy="91" r="13" fill="#f7fbfc" stroke="#087da9" stroke-width="6"/><circle cx="210" cy="280" r="160" fill="url(#pacTagBlue)" stroke="#047cae" stroke-width="8"/><circle cx="210" cy="280" r="150" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3"/><g fill="#fff"><ellipse cx="165" cy="205" rx="25" ry="31" transform="rotate(-20 165 205)"/><ellipse cx="207" cy="184" rx="26" ry="33"/><ellipse cx="252" cy="202" rx="25" ry="31" transform="rotate(20 252 202)"/><ellipse cx="285" cy="242" rx="22" ry="28" transform="rotate(32 285 242)"/><path d="M144 293c0-50 29-83 66-83 38 0 69 33 69 83 0 36-29 58-68 58-39 0-67-21-67-58Z"/></g><path d="M92 354c52 54 139 69 231 18" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".98"/><path d="M86 346c19 9 29 13 44 16" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/></svg></div>';
      html=html.replace(oldBrand,newBrand).replace(oldTag,newTag);
      html=html.replace('</head>',mobileFix+visualFix+'</head>');
      document.open();document.write(html);document.close();
    })
    .catch(()=>location.replace('/landing.html'));
})();
</script>
</head>
<body><div class="loading"><div><div class="paw">🐾</div>Cargando Patas a Casa…</div></div></body>
</html>
