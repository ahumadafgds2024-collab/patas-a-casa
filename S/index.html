<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e9">
<title>Abriendo · Patas a Casa</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f6f1e9;color:#181817;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}.box{text-align:center}.tag{width:58px;height:58px;margin:0 auto 16px;border-radius:50%;background:#181817;color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 10px 28px rgba(30,22,16,.16);position:relative}.tag:before{content:"";position:absolute;top:-7px;width:10px;height:10px;border-radius:50%;background:#f6f1e9;border:2px solid #181817}.box b{display:block;font-size:19px;letter-spacing:-.02em}.box span{display:block;color:#756e65;font-size:13px;margin-top:6px}.dots{display:flex;gap:5px;justify-content:center;margin-top:16px}.dots i{width:6px;height:6px;border-radius:50%;background:#ff6a36;animation:p .9s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.12s}.dots i:nth-child(3){animation-delay:.24s}@keyframes p{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
</style>
</head>
<body>
<div class="box"><div class="tag">🐾</div><b>Patas a Casa</b><span>Abriendo enlace…</span><div class="dots"><i></i><i></i><i></i></div></div>
<script>
const API='https://cgciwutqwnssdphugupq.supabase.co/functions/v1/patas-short';
const m=location.pathname.match(/^\/S\/([A-F0-9]{5})\/?$/i);
const code=(m?.[1]||'').toUpperCase();
(async()=>{
  try{
    if(!code)throw new Error('Código inválido');
    const r=await fetch(API+'?code='+encodeURIComponent(code),{cache:'no-store'});
    const j=await r.json();
    if(!r.ok||!j?.target_url)throw new Error(j?.error||'Enlace no encontrado');
    location.replace(j.target_url);
  }catch(e){
    document.querySelector('.box span').textContent=e.message||'No pudimos abrir este enlace.';
    document.querySelector('.dots').remove();
  }
})();
</script>
</body>
</html>
