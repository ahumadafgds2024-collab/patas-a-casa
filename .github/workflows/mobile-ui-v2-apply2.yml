name: Apply Mobile UI V2
on:
  push:
    paths:
      - '.github/workflows/mobile-ui-v2-apply2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-mobile-v2-work
      - name: Aplicar estilo visual y microinteracciones
        run: |
          python - <<'PY'
          from pathlib import Path

          public_css = r'''
          :root{--pac-bg:#f6f1e9;--pac-surface:#fffdfa;--pac-soft:#fbf6ef;--pac-ink:#181817;--pac-muted:#756e65;--pac-line:rgba(49,39,31,.09);--pac-orange:#ff6a36;--pac-orange2:#ff8557;--pac-green:#23734f;--pac-shadow:0 12px 34px rgba(53,38,25,.075),0 2px 7px rgba(53,38,25,.035);--pac-ease:cubic-bezier(.22,.72,.28,1)}
          html{-webkit-tap-highlight-color:transparent;background:var(--pac-bg);scroll-behavior:smooth}body{background:radial-gradient(circle at 12% -8%,rgba(255,164,112,.17),transparent 27%),radial-gradient(circle at 90% 16%,rgba(68,145,103,.08),transparent 22%),linear-gradient(180deg,#faf7f2 0,var(--pac-bg) 52%,#f4eee6 100%);color:var(--pac-ink);min-height:100dvh}
          .app{max-width:520px;padding:calc(14px + env(safe-area-inset-top)) 12px calc(82px + env(safe-area-inset-bottom))}.header{margin:2px 2px 18px;padding:4px 0 2px}.brand{gap:11px;font-size:17px}.logo{position:relative;width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#27231f,#141312);box-shadow:0 9px 22px rgba(24,20,17,.17)}.logo::before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;border-radius:50%;transform:translateX(-50%);background:#f8f4ee;border:2px solid #1a1917}.demo{min-height:42px;display:flex;align-items:center;padding:8px 13px;border-radius:15px;background:rgba(255,253,250,.82);border:1px solid var(--pac-line);box-shadow:0 4px 16px rgba(53,38,25,.035);backdrop-filter:blur(12px)}
          .card{position:relative;background:rgba(255,253,250,.95);border:1px solid var(--pac-line);border-radius:23px;padding:19px;box-shadow:var(--pac-shadow);margin-bottom:12px;overflow:hidden;animation:pacCardIn .32s var(--pac-ease) both}.card:nth-child(2){animation-delay:.035s}.card:nth-child(3){animation-delay:.07s}.hero{padding:21px}.hero::after{content:"";position:absolute;right:-46px;bottom:-58px;width:145px;height:145px;border:18px solid rgba(255,106,54,.052);border-radius:50%;pointer-events:none}.kicker{font-size:10px;letter-spacing:.105em;color:#bd4d26}h1{font-size:34px;line-height:1.02;letter-spacing:-.052em;margin:9px 0 11px}h2{font-size:20px;letter-spacing:-.027em}.muted{color:var(--pac-muted)}
          .btn{min-height:50px;border-radius:16px;padding:13px 15px;transition:transform .11s var(--pac-ease),box-shadow .16s ease,filter .16s ease,background .16s ease;touch-action:manipulation;user-select:none;-webkit-user-select:none}.btn:active{transform:translateY(1px) scale(.974);box-shadow:0 5px 14px rgba(53,38,25,.075)!important;filter:saturate(.96) brightness(.985)}.primary{background:linear-gradient(135deg,var(--pac-orange),var(--pac-orange2));box-shadow:0 10px 22px rgba(255,106,54,.20)}.dark{background:linear-gradient(145deg,#26231f,#151412);box-shadow:0 9px 18px rgba(23,20,17,.13)}.soft{background:#f1ece5;color:#2c2824}.green{background:#e9f4ed;color:#1c6845;border-color:#cfe5d7}.actions{gap:8px}
          .field{margin-bottom:12px}.field label{font-size:11px;color:#514b45}.field input,.field textarea,.field select{min-height:49px;font-size:16px;border-radius:15px;border:1px solid rgba(60,48,38,.13);background:rgba(255,255,255,.93);transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}.field input:focus,.field textarea:focus,.field select:focus{background:#fff;border-color:rgba(255,106,54,.55);box-shadow:0 0 0 4px rgba(255,106,54,.085)}
          .note,.check,.box{background:var(--pac-soft);border-color:var(--pac-line)}.status{font-size:10px;letter-spacing:.045em;border:none;box-shadow:inset 0 0 0 1px rgba(22,105,70,.10)}.status.lost{box-shadow:inset 0 0 0 1px rgba(176,44,58,.10)}.petrow{gap:14px;margin-top:15px}.avatar{width:94px;height:94px;flex-basis:94px;border-radius:27px;box-shadow:0 9px 24px rgba(63,42,25,.10);transition:transform .16s var(--pac-ease)}.avatar:active{transform:scale(.982)}.avatar img{transition:transform .23s var(--pac-ease)}.avatar:active img{transform:scale(1.025)}.petname{font-size:30px}.meta{color:var(--pac-muted);font-size:13px}.chip{background:#f2ede6;border:1px solid rgba(60,48,38,.055);padding:6px 9px}.box{border-radius:16px}.warn{background:#fff6f1;border-color:rgba(255,106,54,.15)}
          .photo-lightbox{animation:pacFadeIn .18s ease;background:rgba(17,15,13,.93);backdrop-filter:blur(8px)}.photo-lightbox img{animation:pacPhotoIn .24s var(--pac-ease);border-radius:22px}.photo-lightbox-close{transition:transform .12s ease,background .15s ease}.photo-lightbox-close:active{transform:scale(.91);background:rgba(255,255,255,.23)}.loading{position:relative;min-height:100px;display:grid;place-items:center}.loading::after{content:"";position:absolute;bottom:24px;width:92px;height:5px;border-radius:999px;background:linear-gradient(90deg,#eee7df 0,#fff 45%,#eee7df 100%);background-size:220% 100%;animation:pacShimmer 1.1s linear infinite}.toast{bottom:calc(20px + env(safe-area-inset-bottom));border-radius:17px;box-shadow:0 16px 42px rgba(23,19,16,.25);animation:pacToastIn .24s var(--pac-ease) both}
          @keyframes pacCardIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes pacFadeIn{from{opacity:0}to{opacity:1}}@keyframes pacPhotoIn{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}@keyframes pacToastIn{from{opacity:0;transform:translate(-50%,8px) scale(.98)}to{opacity:1;transform:translate(-50%,0) scale(1)}}@keyframes pacShimmer{to{background-position:-220% 0}}
          @media(max-width:450px){.split{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.avatar{width:86px;height:86px;flex-basis:86px}.petname{font-size:28px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
          '''

          account_css = r'''
          :root{--pac-bg:#f6f1e9;--pac-card:#fffdfa;--pac-ink:#181817;--pac-muted:#746d64;--pac-line:rgba(49,39,31,.09);--pac-orange:#ff6a36;--pac-orange2:#ff8557;--pac-green:#23734f;--pac-shadow:0 12px 34px rgba(53,38,25,.075),0 2px 7px rgba(53,38,25,.035);--pac-ease:cubic-bezier(.22,.72,.28,1)}
          html{-webkit-tap-highlight-color:transparent;background:var(--pac-bg);scroll-behavior:smooth}body{background:radial-gradient(circle at 10% -6%,rgba(255,160,105,.16),transparent 28%),radial-gradient(circle at 94% 18%,rgba(55,127,85,.075),transparent 22%),linear-gradient(180deg,#faf7f2 0,var(--pac-bg) 52%,#f3ede5 100%);color:var(--pac-ink);min-height:100dvh}.app{max-width:520px;padding:calc(14px + env(safe-area-inset-top)) 12px calc(86px + env(safe-area-inset-bottom))}
          header{margin:2px 3px 18px;padding:4px 0}.brand{gap:11px;font-size:17px}.logo{position:relative;width:45px;height:45px;border-radius:50%;background:linear-gradient(145deg,#27231f,#141312);box-shadow:0 9px 22px rgba(24,20,17,.17)}.logo::before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;border-radius:50%;transform:translateX(-50%);background:#f8f4ee;border:2px solid #1a1917}.card{position:relative;background:rgba(255,253,250,.95);border:1px solid var(--pac-line);border-radius:23px;padding:19px;box-shadow:var(--pac-shadow);margin-bottom:12px;animation:pacCardIn .32s var(--pac-ease) both}.card:nth-child(2){animation-delay:.035s}.card:nth-child(3){animation-delay:.07s}.hero{overflow:hidden}.hero::after{content:"";position:absolute;right:-55px;bottom:-63px;width:155px;height:155px;border:19px solid rgba(255,106,54,.05);border-radius:50%;pointer-events:none}.kicker{font-size:10px;letter-spacing:.105em;color:#bd4d26}h1{font-size:34px;line-height:1.02;letter-spacing:-.05em}h2{font-size:20px}.muted{color:var(--pac-muted)}
          .btn{min-height:49px;border-radius:16px;padding:12px 14px;transition:transform .11s var(--pac-ease),box-shadow .16s ease,filter .16s ease,background .16s ease;touch-action:manipulation;user-select:none;-webkit-user-select:none}.btn:active{transform:translateY(1px) scale(.974);box-shadow:0 5px 14px rgba(53,38,25,.075)!important;filter:saturate(.96) brightness(.985)}.primary{background:linear-gradient(135deg,var(--pac-orange),var(--pac-orange2));box-shadow:0 10px 22px rgba(255,106,54,.19)}.dark{background:linear-gradient(145deg,#26231f,#151412);box-shadow:0 9px 18px rgba(23,20,17,.13)}.soft{background:#f1ece5;color:#2c2824}.green{background:#e9f4ed;color:#1c6845;border-color:#cfe5d7}.red{background:#fff0f2;color:#a93442;border-color:#f4d1d6}
          .tabs{background:#eee8e0;border-radius:16px;padding:4px}.tab{min-height:43px;border-radius:13px;transition:transform .12s var(--pac-ease),background .18s ease,color .18s ease,box-shadow .18s ease}.tab:active{transform:scale(.975)}.tab.on{box-shadow:0 4px 13px rgba(39,29,21,.07)}.field{margin-bottom:12px}.field label{font-size:11px;color:#514b45}.field input,.field textarea,.field select{min-height:49px;font-size:16px;border-radius:15px;border:1px solid rgba(60,48,38,.13);background:rgba(255,255,255,.93);transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}.field input:focus,.field textarea:focus,.field select:focus{background:#fff;border-color:rgba(255,106,54,.55);box-shadow:0 0 0 4px rgba(255,106,54,.085)}.note,.step,.photo-pick{background:#fbf6ef;border-color:var(--pac-line)}
          .pets{gap:12px}.pet{border:1px solid var(--pac-line);border-radius:22px;padding:15px;background:rgba(255,255,255,.91);box-shadow:0 5px 19px rgba(53,38,25,.045);animation:pacPetIn .34s var(--pac-ease) both}.pethead{gap:13px}.avatar{width:82px;height:82px;flex-basis:82px;border-radius:24px;box-shadow:0 8px 22px rgba(63,42,25,.10);transition:transform .16s var(--pac-ease)}.avatar:active{transform:scale(.982)}.avatar img{transition:transform .23s var(--pac-ease)}.avatar:active img{transform:scale(1.025)}.petname{font-size:26px;line-height:1}.meta{color:var(--pac-muted)}.pill{border:none;box-shadow:inset 0 0 0 1px rgba(22,105,70,.10)}.pill.lost{box-shadow:inset 0 0 0 1px rgba(176,44,58,.10)}
          .pet .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.pet .actions .btn{min-width:0}.pet .actions>*:first-child{grid-column:1/-1}.pet .actions .red,.pet .actions .green{min-height:52px}.pet .actions .primary{box-shadow:none;background:#f4eee7;color:#372f29}.pet .actions .dark{background:#282521}
          .modal{padding:0;align-items:flex-end;background:rgba(24,20,17,.43);backdrop-filter:blur(2px)}.modal:not(.hidden){animation:pacBackdropIn .18s ease both}.sheet{width:100%;max-width:520px;max-height:91dvh;border-radius:27px 27px 0 0;padding:26px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(25,20,16,.20);animation:pacSheetUp .28s var(--pac-ease) both;position:relative}.sheet::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:38px;height:5px;border-radius:999px;background:#ddd6ce}.sheethead{margin-top:5px}.x{min-width:42px;min-height:42px;background:#f0ebe4;transition:transform .12s ease}.x:active{transform:scale(.91)}.photo-prev{border-radius:22px}.file-btn{min-height:43px;border-radius:14px;transition:transform .11s ease}.file-btn:active{transform:scale(.975)}
          .loading{position:relative;min-height:105px;display:grid;place-items:center}.loading::after{content:"";position:absolute;bottom:25px;width:92px;height:5px;border-radius:999px;background:linear-gradient(90deg,#eee7df 0,#fff 45%,#eee7df 100%);background-size:220% 100%;animation:pacShimmer 1.1s linear infinite}.toast{bottom:calc(20px + env(safe-area-inset-bottom));border-radius:17px;box-shadow:0 16px 42px rgba(23,19,16,.25);animation:pacToastIn .24s var(--pac-ease) both}
          @keyframes pacCardIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes pacPetIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}@keyframes pacBackdropIn{from{opacity:0}to{opacity:1}}@keyframes pacSheetUp{from{opacity:.5;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes pacToastIn{from{opacity:0;transform:translate(-50%,8px) scale(.98)}to{opacity:1;transform:translate(-50%,0) scale(1)}}@keyframes pacShimmer{to{background-position:-220% 0}}
          @media(max-width:560px){.topline{flex-direction:column}.install{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{min-width:0}.split{grid-template-columns:1fr}.pet .actions{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
          '''

          recovery_css = r'''
          html{-webkit-tap-highlight-color:transparent;background:#f6f1e9}body{background:radial-gradient(circle at 10% -6%,rgba(255,160,105,.16),transparent 28%),linear-gradient(180deg,#faf7f2,#f6f1e9);min-height:100dvh}.app{max-width:520px;padding:calc(16px + env(safe-area-inset-top)) 12px calc(70px + env(safe-area-inset-bottom))}.logo{position:relative;border-radius:50%;background:linear-gradient(145deg,#27231f,#141312);box-shadow:0 9px 22px rgba(24,20,17,.17)}.logo::before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;border-radius:50%;transform:translateX(-50%);background:#f8f4ee;border:2px solid #1a1917}.card{border-color:rgba(49,39,31,.09);border-radius:24px;box-shadow:0 12px 34px rgba(53,38,25,.075);background:rgba(255,253,250,.95);animation:pacIn .3s cubic-bezier(.22,.72,.28,1) both}.btn{min-height:50px;border-radius:16px;transition:transform .11s ease}.btn:active{transform:translateY(1px) scale(.974)}.field input{min-height:49px;font-size:16px;border-radius:15px}@keyframes pacIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
          '''

          def inject(path,css):
              p=Path(path);s=p.read_text(encoding='utf-8')
              if 'pac-mobile-ui-v2' in s: return
              s=s.replace('</head>',f'<style id="pac-mobile-ui-v2">{css}</style></head>',1)
              s=s.replace('<meta name="theme-color" content="#171719">','<meta name="theme-color" content="#f6f1e9">',1)
              p.write_text(s,encoding='utf-8')
          inject('index.html',public_css)
          inject('mi-cuenta/index.html',account_css)
          if Path('mi-cuenta/recuperar/index.html').exists(): inject('mi-cuenta/recuperar/index.html',recovery_css)
          PY
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for i,f in enumerate(['index.html','mi-cuenta/index.html','mi-cuenta/recuperar/index.html']):
              p=Path(f)
              if not p.exists(): continue
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',p.read_text(encoding='utf-8'),re.S|re.I)
              Path(f'/tmp/pac-{i}.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          for f in /tmp/pac-*.js; do node --check "$f"; done
      - name: Confirmar que sólo cambia interfaz
        run: |
          grep -q 'pac-mobile-ui-v2' index.html
          grep -q 'pac-mobile-ui-v2' mi-cuenta/index.html
          grep -q 'openFlyer' mi-cuenta/index.html || true
          grep -q 'showSightings' mi-cuenta/index.html || true
          grep -q 'toggleLost' mi-cuenta/index.html || true
      - name: Guardar cambios
        run: |
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mi-cuenta/index.html mi-cuenta/recuperar/index.html
          git commit -m 'Pulir diseño mobile-first de Patas a Casa'
          git push origin HEAD:ui-mobile-v2-work
