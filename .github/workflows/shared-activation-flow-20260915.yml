name: Activación simple con código compartido

on:
  push:
    paths:
      - '.github/workflows/shared-activation-flow-20260915.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar flujo PAC compartido
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'No encontré bloque esperado: {label}')
              return text.replace(old, new, 1)

          def must_regex(text, pattern, repl, label):
              new, n = re.subn(pattern, repl, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'No pude reemplazar {label}: coincidencias={n}')
              return new

          # ---------- tag.html ----------
          p = Path('tag.html')
          s = p.read_text(encoding='utf-8')
          s = must_replace(
              s,
              'const REGISTER_API=SUPABASE_URL+"/functions/v1/patas-register-v2";\nconst LOST_API=',
              'const REGISTER_API=SUPABASE_URL+"/functions/v1/patas-register-v2";\nconst SHARED_API=SUPABASE_URL+"/functions/v1/patas-shared-activation";\nconst LOST_API=',
              'SHARED_API en tag.html'
          )
          s = must_replace(
              s,
              'async function registerPost(data){const r=await fetch(REGISTER_API,{method:"POST",headers:{"Content-Type":"application/json","apikey":PUBLISHABLE_KEY},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"No pudimos configurar el correo");return j}\n\nfunction home(){',
              'async function registerPost(data){const r=await fetch(REGISTER_API,{method:"POST",headers:{"Content-Type":"application/json","apikey":PUBLISHABLE_KEY},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"No pudimos configurar el correo");return j}\nasync function sharedGet(c){const r=await fetch(SHARED_API+"?action=is_shared&code="+encodeURIComponent(c),{cache:"no-store"});const j=await r.json().catch(()=>({}));return r.ok&&j.shared===true}\nasync function sharedPost(data){const r=await fetch(SHARED_API,{method:"POST",headers:{"Content-Type":"application/json","apikey":PUBLISHABLE_KEY},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"No pudimos validar la chapita");return j}\n\nfunction home(){',
              'helpers shared en tag.html'
          )

          shared_unactivated = r'''function unactivated(c,activationMode="pin"){
 document.title="Activar chapita · Patas a Casa";
 if(activationMode==="shared"){
  root.innerHTML=`<section class="card hero">
    <div class="kicker">CHAPITA NUEVA</div>
    <h1>Activá tu chapita 🐾</h1>
    <p class="muted">Escaneaste el QR correcto. Ahora ingresá el código de activación que vino con el producto.</p>
    <div class="stepbar"><div class="step on"></div><div class="step"></div><div class="step"></div><div class="step"></div></div>
   </section>
   <section class="card">
    <div class="note"><b>Chapita ${esc(c)} detectada ✅</b><br>El QR identifica esta chapita de forma única.</div>
    <form id="sharedActivationForm" method="post" style="margin-top:14px">
      <div class="field"><label>Código de activación</label><input name="activation_code" autocomplete="off" autocapitalize="characters" maxlength="16" placeholder="Ingresá el código" required><div class="small muted" style="margin-top:6px">Encontralo en el envoltorio de tu chapita.</div></div>
      <button class="btn primary" id="sharedContinue" type="submit">Continuar</button>
    </form>
   </section>`;
  document.getElementById("sharedActivationForm").addEventListener("submit",async e=>{
   e.preventDefault();const activationCode=String(new FormData(e.currentTarget).get("activation_code")||"").trim().toUpperCase().replace(/\s+/g,"");const b=document.getElementById("sharedContinue");b.disabled=true;b.textContent="Verificando…";
   try{await sharedPost({action:"validate_code",public_code:c,activation_code:activationCode});sessionStorage.setItem(GOOGLE_PENDING_KEY,JSON.stringify({public_code:c,activation_code:activationCode,activation_method:"shared",created_at:Date.now()}));location.assign("/mi-cuenta/?activar="+encodeURIComponent(c))}
   catch(err){toast(err.message);b.disabled=false;b.textContent="Continuar"}
  });
  return;
 }
 root.innerHTML=`'''
          s = must_regex(
              s,
              r'function unactivated\(c,activationMode="pin"\)\{.*?\n root\.innerHTML=`',
              lambda m: shared_unactivated,
              'rama de activación nueva en tag.html'
          )
          s = must_replace(
              s,
              ' try{const data=await getTag(code);if(data.state==="unactivated"){unactivated(code,data.activation_mode)}else{const lostInfo=await getLostInfo(code).catch(()=>null);active(code,{...data.pet,...(lostInfo||{})})}}',
              ' try{const data=await getTag(code);if(data.state==="unactivated"){let mode=data.activation_mode;if(await sharedGet(code).catch(()=>false))mode="shared";unactivated(code,mode)}else{const lostInfo=await getLostInfo(code).catch(()=>null);active(code,{...data.pet,...(lostInfo||{})})}}',
              'boot tag.html'
          )
          p.write_text(s, encoding='utf-8')

          # ---------- mi-cuenta/index.html ----------
          p = Path('mi-cuenta/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n<script src="https://cdn\.jsdelivr\.net/npm/jsqr@1\.4\.0/dist/jsQR\.js"[^>]*></script>', '', s, count=1)
          s = must_replace(
              s,
              'const ACCOUNT_API=SUPABASE_URL+"/functions/v1/patas-account";\nconst SECURITY_API=',
              'const ACCOUNT_API=SUPABASE_URL+"/functions/v1/patas-account";\nconst SHARED_API=SUPABASE_URL+"/functions/v1/patas-shared-activation";\nconst SECURITY_API=',
              'SHARED_API en Mi cuenta'
          )

          new_queue = '''function queueGoogleActivation(publicCode,activationCode="",activationMethod="pin"){
 const c=String(publicCode||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,12),raw=String(activationCode||"").trim().toUpperCase().replace(/\\s+/g,"").slice(0,32),pin=String(activationCode||"").replace(/\\D/g,"").slice(0,8);
 if(!c)throw new Error("Ingresá el código de la chapita.");
 const method=activationMethod==="shared"?"shared":activationMethod==="qr"?"qr":"pin";
 if(method==="pin"&&!/^\\d{8}$/.test(pin))throw new Error("Ingresá los 8 números del PIN.");
 if(method==="shared"&&!raw)throw new Error("Ingresá el código de activación.");
 const secret=method==="pin"?pin:method==="shared"?raw:"";
 const pending={public_code:c,activation_code:secret,activation_method:method,created_at:Date.now()};sessionStorage.setItem(GOOGLE_PENDING_KEY,JSON.stringify(pending));return pending;
}
function pendingGoogleActivation()'''
          s = must_regex(
              s,
              r'function queueGoogleActivation\(publicCode,activationCode="",activationMethod="pin"\)\{.*?\n\}\nfunction pendingGoogleActivation\(\)',
              lambda m: new_queue,
              'queueGoogleActivation'
          )

          s = must_replace(
              s,
              'async function accountPost(data,requiresAuth=true){let s=requiresAuth?await validSession():null;const h={"Content-Type":"application/json","apikey":PUBLISHABLE_KEY};if(s?.access_token)h.Authorization="Bearer "+s.access_token;const r=await fetch(ACCOUNT_API,{method:"POST",headers:h,body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(r.status===401&&requiresAuth){setSession(null);showAuth("Tu sesión venció. Volvé a ingresar.");throw new Error("Sesión vencida.")}if(!r.ok)throw new Error(j.error||"Ocurrió un error.");return j}\n',
              'async function accountPost(data,requiresAuth=true){let s=requiresAuth?await validSession():null;const h={"Content-Type":"application/json","apikey":PUBLISHABLE_KEY};if(s?.access_token)h.Authorization="Bearer "+s.access_token;const r=await fetch(ACCOUNT_API,{method:"POST",headers:h,body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(r.status===401&&requiresAuth){setSession(null);showAuth("Tu sesión venció. Volvé a ingresar.");throw new Error("Sesión vencida.")}if(!r.ok)throw new Error(j.error||"Ocurrió un error.");return j}\nasync function sharedPost(data,requiresAuth=false){let s=requiresAuth?await validSession():null;const h={"Content-Type":"application/json","apikey":PUBLISHABLE_KEY};if(s?.access_token)h.Authorization="Bearer "+s.access_token;const r=await fetch(SHARED_API,{method:"POST",headers:h,body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(r.status===401&&requiresAuth){setSession(null);showAuth("Tu sesión venció. Volvé a ingresar.");throw new Error("Sesión vencida.")}if(!r.ok)throw new Error(j.error||"No pudimos continuar con la chapita.");return j}\n',
              'sharedPost'
          )

          new_claim = '''function openClaim(){openPinClaim()}

async function showSharedActivationConfirmation(pending){
 if(!pending?.public_code)return loadDashboard();
 let email=getSession()?.user?.email||currentUser?.email||"";
 if(!email){try{const d=await accountPost({action:"list_my_pets"});currentUser=d.user;email=d.user?.email||""}catch{}}
 document.getElementById("accountMenuBtn")?.classList.add("hidden");
 root.innerHTML=`<section class="card hero"><div class="kicker">NUEVA CHAPITA</div><h1>Chapita detectada 🐾</h1><p class="muted">El QR identifica la chapita <b>${esc(pending.public_code)}</b>.</p></section><section class="card"><div class="status ok" style="margin-bottom:14px"><b>Código de activación correcto ✅</b></div><h2>¿Querés vincular esta chapita a tu cuenta?</h2><div class="note"><b>Cuenta:</b> ${esc(email||"tu cuenta actual")}</div><button class="btn primary wide" id="confirmSharedActivation" type="button" style="margin-top:14px">Vincular a mi cuenta</button><button class="btn soft wide" id="cancelSharedActivation" type="button" style="margin-top:9px">Cancelar</button></section>`;
 document.getElementById("confirmSharedActivation").onclick=async e=>{const b=e.currentTarget,bak=b.textContent;b.disabled=true;b.textContent="Vinculando…";try{const result=await prepareQueuedActivation(pending);clearGoogleActivation();if(result?.profile_required&&result?.public_code){history.replaceState({},document.title,"/mi-cuenta/?completar="+encodeURIComponent(result.public_code));showActivationProfile(result.public_code);return}history.replaceState({},document.title,"/mi-cuenta/");await loadDashboard();toast(result?.already?"Esta chapita ya está en tu cuenta ✅":"Chapita vinculada ✅")}catch(err){toast(err.message);b.disabled=false;b.textContent=bak}};
 document.getElementById("cancelSharedActivation").onclick=async()=>{clearGoogleActivation();history.replaceState({},document.title,"/mi-cuenta/");await loadDashboard()};
}

async function prepareQueuedActivation(pending){if(!pending)return null;if(pending.activation_method==="shared")return await sharedPost({action:"prepare_activation",public_code:pending.public_code,activation_code:pending.activation_code},true);return pending.activation_method==="qr"?await accountPost({action:"prepare_qr_activation",public_code:pending.public_code}):await accountPost({action:"prepare_activation",public_code:pending.public_code,activation_code:pending.activation_code})}
async function registerPost'''
          s = must_regex(
              s,
              r'function openClaim\(\)\{.*?\nasync function prepareQueuedActivation\(pending\)\{.*?\}\nasync function registerPost',
              lambda m: new_claim,
              'openClaim + confirmación shared'
          )

          new_show_auth = r'''function showAuth(message=""){
 document.getElementById("accountMenuBtn")?.classList.add("hidden");
 const queued=pendingGoogleActivation(),sharedMode=queued?.activation_method==="shared",qrMode=queued?.activation_method==="qr",specialMode=sharedMode||qrMode,pre=specialMode?queued.public_code:new URLSearchParams(location.search).get("vincular")||"";
 root.innerHTML=`<section class="card hero"><div class="kicker">PANEL DEL RESPONSABLE</div><h1>Tus mascotas, siempre a mano.</h1><p class="muted">Entrá desde acá sin escanear la chapita. Después podés agregar Patas a Casa a la pantalla de inicio.</p></section>
 <section class="card"><div class="tabs"><button class="tab on" id="loginTab">Ingresar</button><button class="tab" id="signupTab">Crear cuenta</button></div>
 ${message?`<div class="status err">${esc(message)}</div>`:""}
 ${sharedMode?`<div class="status ok" style="margin:0 0 14px"><b>Chapita nueva detectada: ${esc(pre)}</b><br>Si ya usás Patas a Casa, ingresá con la misma cuenta para vincularla ahí.<button class="btn soft wide" id="cancelSharedPending" type="button" style="margin-top:10px">Cancelar esta activación</button></div>`:qrMode?`<div class="status ok" style="margin:0 0 14px"><b>Chapita nueva detectada: ${esc(pre)}</b><br>Ingresá o creá una cuenta para agregarla.<button class="btn soft wide" id="cancelQrPending" type="button" style="margin-top:10px">Cancelar esta activación</button></div>`:""}
 <form id="loginForm" method="post">
  <div class="hidden" data-google-options><button class="btn google wide" id="googleLogin" type="button"><span class="google-mark" aria-hidden="true">G</span>Continuar con Google</button><div class="auth-divider">o ingresá con email</div></div>
  <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>
  <div class="field"><label>Contraseña</label><div class="password-wrap"><input id="loginPassword" name="password" type="password" autocomplete="current-password" minlength="8" required><button class="password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Mostrar contraseña" aria-pressed="false">👁</button></div></div>
  <button class="btn primary wide" type="submit">Entrar a mi cuenta</button>
  <a href="/mi-cuenta/recuperar/" style="display:block;text-align:center;margin-top:12px;color:#555;font-size:13px;font-weight:800;text-decoration:none">¿Olvidaste tu contraseña?</a>
 </form>
 <form id="signupForm" class="hidden" method="post">
  <div class="note" style="margin-bottom:14px">${sharedMode?`La chapita ${esc(pre)} se vinculará a la cuenta que estás creando después de verificar tu correo.`:qrMode?`La chapita ${esc(pre)} se activará después de verificar tu correo.`:"Necesitás el código y el PIN privado de tu chapita. Se validan una sola vez y después te enviamos un correo para verificar tu cuenta."}</div>
  ${specialMode?`<input name="code" type="hidden" value="${esc(pre)}">`:`<div class="split"><div class="field"><label>Código de chapita</label><input name="code" value="${esc(pre)}" maxlength="12" placeholder="7B958A9D" required></div><div class="field"><label>PIN privado</label><input name="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" data-pin placeholder="00000000" required><div class="small muted" style="margin-top:6px">Poné los 8 números del PIN.</div></div></div>`}
  <div class="hidden" data-google-options><button class="btn google wide" id="googleSignup" type="button"><span class="google-mark" aria-hidden="true">G</span>Continuar con Google</button><div class="auth-divider">o creá tu acceso con email</div></div>
  <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>
  <div class="field"><label>Elegí una contraseña</label><div class="password-wrap"><input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-password-toggle="signupPassword" aria-label="Mostrar contraseña" aria-pressed="false">👁</button></div><div class="small muted" style="margin-top:6px">Mínimo 8 caracteres.</div></div>
  <label class="check"><input id="legalSignup" type="checkbox" required><div><b>Acepto las condiciones de uso y la privacidad</b><div class="small muted">Al crear la cuenta aceptás las <a href="/mi-cuenta/terminos" style="font-weight:900;color:#171719">Condiciones de uso</a> y consentís el tratamiento de tus datos según la <a href="/mi-cuenta/privacidad" style="font-weight:900;color:#171719">Política de Privacidad</a>.</div></div></label>
  <button class="btn primary wide" type="submit">Crear cuenta y verificar email</button>
 </form></section>`;
 const loginTab=document.getElementById("loginTab"),signupTab=document.getElementById("signupTab"),lf=document.getElementById("loginForm"),sf=document.getElementById("signupForm");
 bindPasswordToggles(root);revealGoogleOptions();
 const cancelPending=()=>{clearGoogleActivation();history.replaceState({},document.title,"/mi-cuenta/");showAuth()};
 document.getElementById("cancelSharedPending")?.addEventListener("click",cancelPending);document.getElementById("cancelQrPending")?.addEventListener("click",cancelPending);
 function tab(which){const sign=which==="signup";loginTab.classList.toggle("on",!sign);signupTab.classList.toggle("on",sign);lf.classList.toggle("hidden",sign);sf.classList.toggle("hidden",!sign)}
 loginTab.onclick=()=>tab("login");signupTab.onclick=()=>tab("signup");if(pre&&!specialMode)tab("signup");
 document.getElementById("googleLogin")?.addEventListener("click",async e=>{const b=e.currentTarget,bak=b.innerHTML;b.disabled=true;b.textContent="Abriendo Google…";try{await startGoogleSignIn(queued)}catch(err){toast(err.message);b.disabled=false;b.innerHTML=bak}});
 document.getElementById("googleSignup")?.addEventListener("click",async e=>{const b=e.currentTarget,bak=b.innerHTML,f=new FormData(sf);if(!document.getElementById("legalSignup")?.checked){toast("Aceptá las condiciones de uso y la Política de Privacidad para continuar.");return}localStorage.setItem("pac_legal_consent",JSON.stringify({version:"2026-08-28",accepted_at:new Date().toISOString()}));b.disabled=true;b.textContent="Abriendo Google…";try{await startGoogleSignIn(specialMode?queued:{public_code:f.get("code"),activation_code:f.get("pin"),activation_method:"pin"})}catch(err){toast(err.message);b.disabled=false;b.innerHTML=bak}});
 lf.addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter,bak=b.textContent,f=new FormData(e.currentTarget);b.disabled=true;b.textContent="Ingresando…";try{await login(f.get("email"),f.get("password"));const pending=pendingGoogleActivation();if(pending?.activation_method==="shared"){await showSharedActivationConfirmation(pending);return}if(pending){const claim=await prepareQueuedActivation(pending);clearGoogleActivation();if(claim?.profile_required&&claim?.public_code){history.replaceState({},document.title,"/mi-cuenta/?completar="+encodeURIComponent(claim.public_code));showActivationProfile(claim.public_code);return}}let fin=null;try{fin=await registerPost({action:"finalize_registration"},true)}catch(err){console.warn("finalize_registration",err)}if(fin?.profile_required&&fin?.public_code){history.replaceState({},document.title,"/mi-cuenta/?completar="+encodeURIComponent(fin.public_code));showActivationProfile(fin.public_code);return}history.replaceState({},document.title,"/mi-cuenta/");await loadDashboard();if(fin?.linked&&!fin?.already)toast("Correo verificado. Tu mascota ya está vinculada ✅")}catch(err){const m=/email not confirmed/i.test(String(err?.message||""))?"Primero confirmá tu correo desde el enlace que te enviamos.":err.message;toast(m)}finally{if(document.body.contains(b)){b.disabled=false;b.textContent=bak}}});
 sf.addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget,b=e.submitter,bak=b.textContent,f=new FormData(form),mail=String(f.get("email")).trim().toLowerCase(),pass=String(f.get("password")),tagCode=String(f.get("code")||"").trim().toUpperCase();b.disabled=true;b.textContent="Enviando verificación…";try{localStorage.setItem("pac_legal_consent",JSON.stringify({version:"2026-08-28",accepted_at:new Date().toISOString()}));if(sharedMode)await sharedPost({action:"start_registration",public_code:tagCode,activation_code:queued.activation_code,email:mail,password:pass,legal_consent:true,legal_version:"2026-08-28"},false);else await registerPost({action:"start_registration",public_code:tagCode,activation_code:qrMode?"":f.get("pin"),activation_method:qrMode?"qr":"pin",email:mail,password:pass,legal_consent:true,legal_version:"2026-08-28"},false);form.innerHTML=`<div class="status ok"><b>Revisá tu correo ✅</b><br>Te enviamos un enlace de verificación a ${esc(mail)}.</div><p class="muted small">Abrí el correo y tocá el enlace. Si no lo encontrás en la bandeja de entrada, revisá Spam. Después vas a cargar los datos de la mascota y entrar a Mi cuenta.</p><button class="btn soft wide" type="button" id="resendVerification">Reenviar correo de verificación</button><div class="small muted" id="resendStatus" style="margin-top:9px;text-align:center"></div><button class="btn dark wide" type="button" id="goLogin" style="margin-top:9px">Ir a ingresar</button>`;document.getElementById("goLogin").onclick=()=>tab("login");const resend=document.getElementById("resendVerification"),resendStatus=document.getElementById("resendStatus");resend.onclick=async()=>{const old=resend.textContent;resend.disabled=true;resend.textContent="Reenviando…";resendStatus.textContent="";try{if(sharedMode)await sharedPost({action:"resend_confirmation",public_code:tagCode,email:mail},false);else await registerPost({action:"resend_confirmation",public_code:tagCode,email:mail},false);resend.textContent="Correo reenviado ✅";resendStatus.textContent="Enviamos un enlace nuevo. Revisá también Spam."}catch(err){resendStatus.textContent=err.message;resend.disabled=false;resend.textContent=old}}}catch(err){toast(err.message)}finally{if(document.body.contains(b)){b.disabled=false;b.textContent=bak}}});
}

function showActivationProfile'''
          s = must_regex(
              s,
              r'function showAuth\(message=""\)\{.*?\n\}\n\nfunction showActivationProfile',
              lambda m: new_show_auth,
              'showAuth shared'
          )

          new_dashboard = r'''function renderDashboard(){
 document.getElementById("accountMenuBtn")?.classList.remove("hidden");
 const iosInstall=isiOS(),quickAccess=isStandalone()?"":`<section class="card quick-access-card"><h2>Acceso rápido</h2><p class="muted small">Instalá este panel en tu celular para abrirlo desde un ícono, sin escanear ninguna chapita.</p><button class="btn dark wide" onclick="installApp()">${uiIcon("home")}<span>${iosInstall?"Ver cómo agregarla":"Añadir Patas a Casa al inicio"}</span></button></section>`;
 const addGuide=`<section class="card"><div class="kicker">NUEVA CHAPITA</div><h2 style="margin-top:7px">¿Querés agregar otra chapita?</h2><p class="muted">Abrí la <b>cámara de tu celular</b> y escaneá el QR de la nueva chapita. Ingresá el código de activación del envoltorio y vas a poder vincularla a esta misma cuenta.</p><div class="note"><b>Usá esta misma cuenta:</b> ${esc(currentUser?.email||"")}</div><details class="optional"><summary>¿Tenés una chapita anterior con PIN?</summary><p class="small muted">Las chapitas anteriores siguen funcionando con su PIN privado de 8 números.</p><button class="btn soft wide" type="button" onclick="openPinClaim()">Vincular chapita anterior</button></details></section>`;
 root.innerHTML=`<section class="card account-overview"><div class="topline"><div><div class="kicker">MI CUENTA</div><h1 style="font-size:31px;margin-bottom:6px">Tus mascotas.</h1><div class="account-email">${esc(currentUser?.email||"")}</div></div><button id="installBtn" class="btn primary install ${isStandalone()?"hidden":""}" onclick="installApp()">${uiIcon("home")}<span>${iosInstall?"Ver cómo agregarla":"Añadir al inicio"}</span></button></div></section>
 <section class="community-card"><a class="community-link" href="/mi-cuenta/perdidas/">${uiIcon("users")}<span>Mascotas perdidas</span><span class="community-arrow" aria-hidden="true">→</span></a></section>
 <section class="card pets-card"><h2>Mis mascotas</h2><div class="pets">${pets.length?pets.map(petCard).join(""):`<div class="empty">Todavía no hay mascotas vinculadas.<br><span class="small muted">Para agregar una nueva, escaneá su QR físico con la cámara del celular.</span></div>`}</div></section>
 ${addGuide}${quickAccess}
 <div class="small muted" style="text-align:center;padding:8px 4px 2px"><a href="/mi-cuenta/privacidad" style="color:inherit;font-weight:850">Privacidad</a> · <a href="/mi-cuenta/terminos" style="color:inherit;font-weight:850">Condiciones de uso</a></div>`;
}
async function resolveTagCodeByPin'''
          s = must_regex(
              s,
              r'function renderDashboard\(\)\{.*?\n\}\nasync function resolveTagCodeByPin',
              lambda m: new_dashboard,
              'dashboard sin escáner web'
          )

          s = must_regex(
              s,
              r'function normalizedTagCode\(value\)\{.*?\nfunction openPinClaim\(',
              'function openPinClaim(',
              'lector QR por foto'
          )

          old_boot = '''async function boot(){
