<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<title>Patas a Casa</title>
<link rel="icon" type="image/png" href="/mi-cuenta/icons/icon-192.png">
<style>html,body{margin:0;min-height:100%;background:#fff8f1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#17324d;font-weight:800}.loading div{text-align:center}.paw{font-size:34px;margin-bottom:10px}</style>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const tag=params.get('tag');
  if(tag){
    location.replace('/tag.html?tag='+encodeURIComponent(tag));
    return;
  }
  fetch('/landing.html',{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('landing');return r.text()})
    .then(html=>{
      const mobileFix='<style id="pac-landing-mobile-fix">@media(max-width:680px){.nav-actions>a.btn{display:none!important}.nav{gap:10px}.brand{min-width:0}.mobile-menu a:last-child{background:#17324d;color:#fff;margin-top:4px;text-align:center}}</style>';
      html=html.replace('</head>',mobileFix+'</head>');
      document.open();document.write(html);document.close();
    })
    .catch(()=>location.replace('/landing.html'));
})();
</script>
</head>
<body><div class="loading"><div><div class="paw">🐾</div>Cargando Patas a Casa…</div></div></body>
</html>
