name: Check Admin QR 21x21
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar generador directo y QR V1-L
        run: |
          set -euo pipefail
          python -m json.tool vercel.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('admin.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/admin.js').write_text('\n'.join(blocks),encoding='utf-8')
          assert 'patas-admin-direct' in s
          assert 'generate_direct_batch' in s
          assert 'WWW.PATASACASA.COM.AR/S/' in s
          assert 'qr_payload' in s
          assert "version:1" in s
          assert "errorCorrectionLevel:'L'" in s
          assert 'created.modules.size!==21' in s
          assert 'text.length>41' in s
          assert 'QR 21×21 · V1-L' in s
          assert 'shortio_api_key' not in s
          assert 'TinyURL consume' not in s
          PY
          node --check /tmp/admin.js
