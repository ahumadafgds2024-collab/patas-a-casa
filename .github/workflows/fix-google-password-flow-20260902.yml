name: Fix Google Password Flow 20260902

on:
  push:
    paths:
      - '.github/scripts/fix_google_password_flow_20260902.py'
      - '.github/workflows/fix-google-password-flow-20260902.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir flujo Google y contraseña
        run: python .github/scripts/fix_google_password_flow_20260902.py
      - name: Verificar invariantes
        run: |
          grep -q 'GOOGLE_JUST_SIGNED_IN_KEY)!=="1"' mi-cuenta/index.html
          grep -q '>Ahora no</button>' mi-cuenta/index.html
          grep -q 'await updateAccountPassword(password)' mi-cuenta/index.html
          ! grep -q 'await login(sessionEmail,password)' mi-cuenta/index.html
          ! grep -q 'openPasswordSettings(true)' mi-cuenta/index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- mi-cuenta/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-cuenta/index.html
          git commit -m 'Corregir sesión Google al crear contraseña'
          git push
