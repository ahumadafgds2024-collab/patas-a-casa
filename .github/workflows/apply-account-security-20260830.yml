name: Apply Account Security 20260830

on:
  push:
    paths:
      - '.github/workflows/apply-account-security-20260830.yml'
      - '.github/scripts/apply_account_security_20260830.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar parte 2
        run: python .github/scripts/apply_account_security_20260830.py
      - name: Verificar seguridad de cuenta
        run: |
          grep -q 'const SECURITY_API=' mi-cuenta/index.html
          grep -q 'Crear o cambiar contraseña' mi-cuenta/index.html
          grep -q 'Eliminar definitivamente' mi-cuenta/index.html
          grep -q 'async function updateAccountPassword' mi-cuenta/index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- mi-cuenta/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-cuenta/index.html
          git commit -m 'Agregar seguridad y gestión de cuenta'
          git push
