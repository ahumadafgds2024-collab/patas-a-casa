<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f1e9">
<title>Confirmar correo · Patas a Casa</title>
<style>
:root{--ink:#171719;--muted:#737373;--line:#e7e6e1;--orange:#ff6a36;--orange2:#ff8c65}*{box-sizing:border-box}html{background:#f6f1e9}body{margin:0;background:linear-gradient(180deg,#faf7f2 0,#f6f1e9 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:640px;margin:auto;padding:24px 16px 70px}.brand{display:flex;gap:10px;align-items:center;font-weight:950;margin-bottom:18px}.logo{width:44px;height:44px;border-radius:15px;background:#171719;color:#fff;display:grid;place-items:center}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 18px 55px rgba(20,20,20,.08)}.kicker{font-size:11px;letter-spacing:.08em;font-weight:950;color:#ce4d20}h1{font-size:36px;line-height:1.02;letter-spacing:-.05em;margin:10px 0 12px}.muted{color:var(--muted);line-height:1.5}.status{margin-top:14px;padding:13px 14px;border-radius:15px;font-size:13px;line-height:1.45;background:#ebf8f0;color:#176f45}.status.err{background:#fff0f1;color:#a92f3b}.btn{display:inline-flex;width:100%;justify-content:center;text-decoration:none;border:0;border-radius:15px;padding:13px 15px;font-weight:900;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;margin-top:14px}
</style>
<style id="pac-brand-logo-v1">
.logo{
  background-image:url('/mi-cuenta/icons/icon-192.png')!important;
  background-repeat:no-repeat!important;
  background-position:center -4px!important;
  background-size:78px 78px!important;
  background-color:transparent!important;
  box-shadow:none!important;
  color:transparent!important;
  font-size:0!important;
  overflow:hidden!important;
  border-radius:14px!important;
}
.logo::before{display:none!important;content:none!important}
</style></head>
<body>
<div class="wrap">
<div class="brand"><div class="logo"></div><div>Patas a Casa<div style="font-size:12px;color:#777">Seguridad de la cuenta</div></div></div>
<section class="card">
<div class="kicker">VERIFICACIÓN DE EMAIL</div>
<h1 id="title">Correo confirmado ✅</h1>
<p class="muted" id="text">Tu dirección de correo quedó verificada.</p>
<div id="status" class="status">Ahora podés iniciar sesión con el email y la contraseña que elegiste.</div>
<a class="btn" id="continueLink" href="/mi-cuenta/">Continuar</a>
</section>
</div>
<script>
const SUPABASE_URL="https://cgciwutqwnssdphugupq.supabase.co";
const PUBLISHABLE_KEY="sb_publishable_oozsLV8QMoy_ooLIqgh_qg_vvjV6IY5";
const REGISTER_API=SUPABASE_URL+"/functions/v1/patas-register-v2";
const SESSION_KEY="pac_owner_session_v1";
const params=new URLSearchParams(location.hash.replace(/^#/,""));
const query=new URLSearchParams(location.search);
const tagCode=String(query.get("chapita")||"").replace(/[^A-Z0-9]/gi,"").slice(0,12);
const title=document.getElementById("title"),copy=document.getElementById("text"),status=document.getElementById("status"),continueLink=document.getElementById("continueLink");

async function finishConfirmation(){
 const error=params.get("error")||params.get("error_code");
 if(error){
  title.textContent="No pudimos confirmar el correo";
  copy.textContent="El enlace puede haber vencido, ya haber sido usado o ser inválido.";
  status.className="status err";status.textContent=params.get("error_description")||"Pedí un nuevo correo de verificación.";
  continueLink.href=tagCode?"/mi-cuenta/?vincular="+encodeURIComponent(tagCode):"/mi-cuenta/";
  continueLink.textContent=tagCode?"Reenviar correo":"Ir a Mi cuenta";return
 }
 const accessToken=params.get("access_token"),refreshToken=params.get("refresh_token");
 if(!accessToken){status.textContent="El correo quedó confirmado. Ingresá a Mi cuenta para continuar.";continueLink.textContent="Ir a Mi cuenta";return}
 const expiresIn=Number(params.get("expires_in")||3600);
 localStorage.setItem(SESSION_KEY,JSON.stringify({access_token:accessToken,refresh_token:refreshToken||"",expires_in:expiresIn,expires_at:Math.floor(Date.now()/1000)+expiresIn,token_type:params.get("token_type")||"bearer"}));
 history.replaceState({},document.title,location.pathname+location.search);
 title.textContent="Correo confirmado ✅";copy.textContent="Tu cuenta ya está verificada.";status.textContent="Preparando el perfil de tu mascota…";
 try{
  const response=await fetch(REGISTER_API,{method:"POST",headers:{"Content-Type":"application/json","apikey":PUBLISHABLE_KEY,"Authorization":"Bearer "+accessToken},body:JSON.stringify({action:"finalize_registration"})});
  const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||"No pudimos continuar automáticamente.");
  if(result.profile_required&&result.public_code){
   const next="/mi-cuenta/?completar="+encodeURIComponent(result.public_code);continueLink.href=next;continueLink.textContent="Cargar datos de mi mascota";status.textContent="Ahora vas a cargar los datos de tu mascota. No te pediremos nuevamente el código ni el PIN.";setTimeout(()=>location.replace(next),700);return
  }
  continueLink.href="/mi-cuenta/";continueLink.textContent="Entrar a Mi cuenta";status.textContent="Listo. Entrando a Mi cuenta…";setTimeout(()=>location.replace("/mi-cuenta/"),700);
 }catch(err){
  status.className="status err";status.textContent=err.message+" Tu sesión quedó guardada: tocá Continuar para reintentarlo desde Mi cuenta.";continueLink.href="/mi-cuenta/";continueLink.textContent="Continuar en Mi cuenta";
 }
}
finishConfirmation();
</script>
</body>
</html>
