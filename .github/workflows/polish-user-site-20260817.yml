name: Pulir experiencia de usuario

on:
  push:
    paths:
      - '.github/scripts/polish_site_20260817.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar mejoras seguras
        run: python .github/scripts/polish_site_20260817.py

      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for src,out in [('index.html','/tmp/public.js'),('mi-cuenta/index.html','/tmp/account.js')]:
              html=Path(src).read_text(encoding='utf-8')
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
              Path(out).write_text('\n'.join(scripts),encoding='utf-8')
          public=Path('index.html').read_text(encoding='utf-8')
          account=Path('mi-cuenta/index.html').read_text(encoding='utf-8')
          assert 'PRUEBA' not in public
          assert 'K7M4XA' not in public
          assert '📍 Avistamientos' in account
          PY
          node --check /tmp/public.js
          node --check /tmp/account.js

      - name: Publicar
        run: |
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mi-cuenta/index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git commit -m 'Pulir experiencia pública y panel del responsable'
          git push
