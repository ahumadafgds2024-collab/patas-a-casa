name: Add Google Password Prompt 20260830

on:
  push:
    paths:
      - '.github/scripts/add_google_password_prompt_20260830.py'
      - '.github/workflows/add-google-password-prompt-20260830.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar aviso de contraseña
        run: python .github/scripts/add_google_password_prompt_20260830.py
      - name: Verificar resultado
        run: |
          grep -q 'maybeOfferGooglePasswordBackup' mi-cuenta/index.html
          grep -q 'Creá una contraseña de respaldo' mi-cuenta/index.html
          grep -q 'action:"status"' mi-cuenta/index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- mi-cuenta/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mi-cuenta/index.html
          git commit -m 'Ofrecer contraseña de respaldo después de Google'
          git push
