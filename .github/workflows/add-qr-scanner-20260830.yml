name: Limpiar flujos obsoletos 20260830

on:
  push:
    paths:
      - '.github/scripts/add_qr_scanner_20260830.py'
      - '.github/workflows/add-qr-scanner-20260830.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Limpiar lector QR y activacion email-only
        run: |
          sed -i 's/re.subn(queue_pattern, queue_replacement, account/re.subn(queue_pattern, lambda _m: queue_replacement, account/' .github/scripts/add_qr_scanner_20260830.py
          python .github/scripts/add_qr_scanner_20260830.py
      - name: Verificar flujo actual
        run: |
          grep -q 'function openClaim(){openPinClaim()}' mi-cuenta/index.html
          grep -q 'action:"verify_pin"' index.html
          grep -q 'maybeOfferGooglePasswordBackup' mi-cuenta/index.html
          grep -q 'securityPost({action:"password",password})' mi-cuenta/index.html
          ! grep -q 'patas-tag-scan' mi-cuenta/index.html
          ! grep -q 'patas-email-activation' mi-cuenta/index.html
          ! grep -q 'patas-email-activation' index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html mi-cuenta/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'patas-a-casa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mi-cuenta/index.html
          git commit -m 'Limpiar restos de lector QR y activacion email-only'
          git push
